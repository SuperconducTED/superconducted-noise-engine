kadansta yenileniyor: readout ve ilişkili alanlar yaklaşık 4,5 saatte, `zz` yaklaşık 5,2 saatte bir; koherans, kapılar ve `measure_2` yaklaşık 25 saatte bir; `lf` 26,5 ile 26,6 saatte bir (belgeler olay tanımına göre iki değer veriyor).","Kapsam zamanla değişti. 5 Ağustos'a kadar yalnızca canlı yoklamalar var; iki yoklama arasında yayımlanıp bir sonraki yoklamadan önce yenisiyle değişen ara belgeler arşive girmedi. Sonra tarihsel getirmeler geliyor. Aylar arası olay hızı ya da kadans karşılaştırmaları dönemi kontrol etmeli (01 §6)."],"bullets_tr":["**1.760 belge**: 1.317 canlı yoklama (`configuration` dolu) ve 443 tarihsel getirme (`configuration: null`); `backend_version` her belgede 1.3.37, dört hedef işlem kümesi (01 §6).","**12 bilgi taşıyan alan** (33 satırdan): `T1`, `T2`, `readout_error`, iki atama olasılığı, `init_error`, `sx`, `measure_2`, `cz`, `rzz`, `zz`, `lf` (00 §1, §2).","**Kopyalar ayrı bilgi değil**: `x`, `id`, `rx`, `xslow` hataları `sx` ile, `measure` hatası `readout_error` ile, kuplörün iki yönü birbiriyle aynı değeri taşıyor; karşılaştırılan 136.032 ile 309.760 kayıtta 0 değer farkı (01 §5).","**Readout aritmetiği**: `readout_error` = (`prob_meas0_prep1` + `prob_meas1_prep0`) / 2, aynı damgalı 188.100 kaydın hepsinde; iki olasılık 549.120 değerin hepsinde 1/4.096'nın katı (01 §5).","**Tarih anlamı alana göre değişiyor**: ölçülmüş alanlarda kayıt tarihi bir toplu yazım zamanı; eşiklerde, `zz`'de, `rz`'de ve uzunluklarda yalnızca belge zamanı. `last_update_date` en yeni ölçüm damgasına belgelerin yalnızca %19,5'inde eşit (06 §2.2).","**Şema başlangıçları eksik veri değil**: `measure.threshold` 8 Haziran, `init_error` 4 Ağustos, `measure_2` 7 Ağustos, `measure_reset` ve `reset_2` 2 Eylül 2026; `xslow` iki ayrı dönemde (00 §5 madde 8).","**Yer tutucular** (`gate_error >= 1`, \"kalibre edilmedi\") olay oluşturulmadan önce maskeleniyor; her belgede yer tutucu olanlar `sx` için `q72`, `cz` için 4, `rzz` için 5 kuplör (01 §4, §5).","**Kapsam**: günde 9,25 belge (Mayıs) ile 22,77 (Eylül); 12 saati aşan 14 dosya boşluğu, en uzunu 82,7 saat; yoklama defteri 2 Eylül'den itibaren 1.981 satır (06 §2.1)."],"charts":[{"id":"veri-sozluk","type":"bar","orient":"h","title":"Sözlüğün 33 satırından yalnızca 12'si kopya olmayan ölçüm taşıyor","subtitle":"Veri sözlüğünün (01 §3) satırları, duruma göre; satır sayısı. Kalan 19 satırın alt ayrımı bu raporun 01 §3 ve §5'ten yaptığı sınıflama.","read":"12 bilgi taşıyan alan: `T1`, `T2`, `readout_error`, `prob_meas0_prep1`, `prob_meas1_prep0`, `init_error`, `sx`, `measure_2`, `cz`, `rzz`, `zz`, `lf`. İki eşik (`measure.threshold`, `measure_2.threshold`) bir ayırıcı ayarı kaydediyor. 8 satır başka bir satırla aynı değeri taşıyor (örneğin `x`, `id`, `rx` ve `xslow` hataları `sx` ile, `measure` hatası `readout_error` ile), 6 satır sabit, 4 satır cihaz geneli değişen bir uzunluk; `jq` her belgede 0.","source":"00 §1, §2; 01 §3, §5; results/data-layer/profile.json, identities.json","x":{"label":"satır sayısı","scale":"linear"},"y":{"label":"","scale":"band"},"categories":["Bilgi taşıyan ölçüm","Ayırıcı eşik ayarı","Kopya (başka satırla aynı değer)","Sabit (tek değer)","Değişen konfigürasyon uzunluğu","Boş (hep 0)"],"series":[{"name":"satır","values":[12,2,8,6,4,1]}]},{"id":"veri-kadans-aralik","type":"bar","orient":"h","title":"Bilgi taşıyan aileler iki kadansta: yaklaşık 4,5 saat ve yaklaşık 25 saat","subtitle":"Varlık başına ardışık iki yeniden ölçüm olayı arasındaki sürenin medyanı, saat; her alanın bütün varlıklarının bütün olayları birlikte","read":"Readout ailesi (`readout_error` 4,5 saat, `init_error` 4,7 saat) ve `zz` (5,2 saat) gün içinde birkaç kez yenileniyor; `T1` (24,8 saat), `sx` (24,9 saat), `cz` (25,1 saat), `rzz` (25,3 saat) ve `measure_2` (24,7 saat) günde bir kez; `lf` kendi 26,6 saatlik döngüsünde. Aralıklar geniş: `readout_error` için %10 ile %90 dilimleri 2,6 saat ile 10,6 saat, `T1` için 19,2 saat ile 43,8 saat; bunlara yeniden başlatmalar ve kaçan belgeler de giriyo "measure_2.threshold","measure uzunluğu","rz hatası","jq"],"series":[{"name":"pay","values":[0.0,0.4131,0.3402,0.2495,0.2648,0.6727,0.5547,0.3956,0.3758,0.2628,0.0,100.0,100.0,100.0,100.0,100.0,100.0]}]}],"toc_tr":"Veri"},{"section":"kok-soru","title_tr":"Kök soru: ölçümden ölçüme taşınmayan bileşen nedir?","intro_tr":["Arşivdeki her bilgi taşıyan seri üç parçadan oluşuyor: aylarca kararlı kalan, kübite ya da kuplöre özgü bir düzey; haftalar ile aylar içinde yavaşça kayan bir düzey; ve bir ölçümden ötekine taşınmayan büyük bir bileşen. Bu son bileşen her varlık ailesinde hafızasız: log değişimlerinin lag-1 otokorelasyonu -0,425 ile -0,513 arasında, yani bir düzey etrafındaki bağımsız saçılımın -0,5 değerine yakın. En kısa ölçülebilir gecikmedeki yarıvaryans (nugget) uzun gecikme yarıvaryansının 0,43 ile 0,82'si (`lf_10` için 0,94). Kök soru şu: bu bileşen IBM'in kestirim gürültüsü mü, günlük örneklemenin bağımsız çekilişlere çevirdiği hızlı gerçek dinamik mi, yoksa turdan tura yeniden kalibrasyonun izi mi? Bir tahmin modelinin bandının ölçüm hassasiyeti bandı mı fiziksel bir band mı olduğu bu soruya bağlı.","Kanıt iki basit okumayı dışlıyor. Birincisi, bileşenin tümüyle sabit bir düzey etrafında bağımsız kestirim hatası olması: yavaş düzey ve ayrı deneyler arasındaki korelasyonlar buna uymuyor; en sağlamı aynı turdaki `T1` ve `T2` sapmalarının 0,70 korelasyonu (doğrulayıcı iki düzey tanımıyla ve düzeysiz birinci farklarla, 0,714, yeniden üretti). Bu dışlama, IBM'in iki deneyine ortak ve aynı turda iki fiti birlikte saptıran bir yapaylık yoksa geçerli. İkincisi, okuma bileşeninin binom atış (shot) gürültüsü olması: atış gürültüsü okumanın en kısa gecikmedeki değişkenliğinin yaklaşık dörtte biri (0,235); aynı kuraldan geçirilen iid binom plasebo 1,005 veriyor.","Kanıt, bileşenin büyük kısmının fiziksel olduğunu da göstermiyor. `T1`/`T2` dışında ortak parçalar küçük: aileler arası en kısa aralıkta mutlak değerce en fazla 0,130, bir kübiti paylaşan kuplörlerde 0,22. Ortak parçanın zaman ölçeği belirsiz: `sx` ile P(0|1) korelasyonu düzey penceresi ±7 günden ±2 güne inince 0,108'den 0,032'ye düşüyor, `sx` ile `T1` arasındaki yakın-uzak farkı aynı iş ile farklı iş ayrımıyla karışıyor, `cz` ve `rzz` için saatler içindeki yükseliş yeniden kalibrasyondan ayrılamıyor. Paylaşılmayan çoğunluğu ayıracak bir test arşivde yok ve bileşenin büyüklüğü sabit değil (`T1` için Mayıs 2026'da cihaz genelinde yaklaşık yirmi kat değişti). Bu yüzden bileşene ne kestirim gürültüsü ne de fiziksel diyoruz.","Neyin ayırt edeceği (öneri; donanım zamanı ekibin kararı): birkaç `ibm_fez` kübiti ve kuplöründe birkaç saat boyunca dakika aralıklı ardışık tekrarlar (`T1`, Hahn eko, tek ve iki kübit RB, atış sayısı bilinen atama deneyleri), fit belirsizlikleri kaydedilerek, tekrarlar arasında yeniden kalibrasyonla ve kalibrasyonsuz. Kestirim gürültüsü en kısa gecikmeden itibaren düz, tekrar (fit) varyansında duran ve arşivin nugget değerine eşit bir yarıvaryogram öngörür; seyrek örneklenen hızlı dinamik dakikalar ile saatler içinde nugget değerine yükselen bir eğri ve nugget'ın altında bir tekrar varyansı öngörür; yeniden kalibrasyon değişkenliği kalibrasyonlarla hizalı sıçramalar öngörür. IBM meta verisi (RB ayarları, değer başına fit belirsizlikleri, iş kimlikleri, günlük okuma atış sayısı) RB aileleri için hesaplanabilir bir taban ve yakın ile uzak çiftlerin aynı işten gelip gelmediğini verir."],"bullets_tr":["**Her ailede hafızasız bir bileşen.** Log değişimlerinin lag-1 otokorelasyonu her varlık ailesinde -0,425 (`rzz`) ile -0,513 (`|zz|`) arasında, `lf` adlarıyla birlikte -0,36 ile -0,56. En kısa gecikmedeki pay 0,433 (RO, gün içi, 2 ile 4 saat) ile 0,817 (`T1`) arasında. Kısa kutular, paydalar ve kestiriciler ailelere göre farklı olduğu için karşılaştırma yalnızca büyüklük mertebesinde.","**`T1` ile `T2` aynı turda birlikte sapıyor, ama bu paylaşım, kanıtlanmış gerçek değişim değil.** Pearson 0,70 (19.589 olay, 155 kübitin hepsinde pozitif); doğrulayıcı 7 günlük düzeyle 0,701, düzeysiz birinci farklarla 0,714, tur medyanı çıkarılınca 0,69 buldu, plasebolar -0,03 ve 0,05 ile 0,07. Her sapmanın varyansının en az yaklaşık yarısı (ρ² = 0,49) iki fit arasında paylaşılıyor; aynı turda iki fite ortak bir yapaylık dışlanmadı.","**Okumada bilinen kestirim gürültüsü azınlıkta.** Gün içi oturumlarda 2 ile 4 saatte RO değişimi atış gürültüsünün 4,252 katı (24.477 kübit çifti); binom atış gürültüsü bunun 0,235'ini açıklıyor (havuzlanmış log10 ölçeğinde 0,125). İid binom plasebo 1,005. Fazlalık yaklaşık 3 ile 12 saat arasında düz (oturum çifti medyanları 4,209 ile 4,493); 2 saatin altında yalnızca 5 oturum çifti var.","**Bileşenin büyüklüğü durağan değil.** `T1` için turdan tura sağlam yarıvaryans 2026-05-15 ile 05-27 arasındaki 13 turda 0,000404 ile 0,000686, sonrasında tipik olarak 0,0146. 2026-06-26/29'da ikinci bir adım var (medyan 0,0092'den 0,0146'ya, Pettitt p = 5,5×10⁻¹²). Değişenin cihazın ortamı mı değerlerin üretimi mi olduğu arşivden ayrılamıyor.","**`T1`/`T2` dışındaki ortak parçalar küçük.** Bir kübiti paylaşan kuplörler `cz` 0,220 ve `rzz` 0,225 (244 kuplör çifti), 2 adım ve ötesinde -0,020 ile -0,008; `cz` ile `rzz` aynı kuplörde 1 saat içinde 0,205; `sx` ile aynı turdaki `T1` 1 saat içinde -0,096, 1 ile 6 saatte -0,024; 07'nin aileler arası çiftlerinde en kısa aralıkta mutlak değerce en fazla 0,130. Cihaz geneli ortak mod artık varyansın 0,012 ile 0,130'u.","**Ortak parçanın zaman ölçeği kurulmadı.** `sx` ile P(0|1) 0 ile 0,5 saatte 0,108, ±2 günlük düzeyle 0,032. `cz` yarıvaryansı aralıkla artıyor (tek tur değerinin 2 ile 4 saatte 0,33'ü, 12 ile 18 saatte 0,89'u), ama 11 olaya dayanıyor ve yeniden kalibrasyondan ayrılamıyor; olay düzeyinde işaret testi p = 0,065 (`cz`) ve 0,69 (`rzz`, 6 olay). 05'in çift düzeyindeki p-değerleri sözde yineleme nedeniyle çürütüldü.","**`T1` için gün altı kanıt sınırlı.** Eşleştirilmiş test 9 olaya dayanıyor ve yalnızca biri 6 saatin altında (2026-06-12, 3,86 saat, 147 kübit). Medyan oran sahibin eşleştirmesiyle 0,96, doğrulayıcınınkiyle 1,05 (2026-05-30 sonrası 1,19). Desteklenen ifade \"yaklaşık 4 ile 24 saat arasında yükseliş yok\"; bir korelasyon zamanı değil.","**Büyük sapmalar aynı kübit-günde çakışıyor, ama yalnızca uçta.** 3 sd eşiğinde iki farklı ailenin aynı kübit-günde birlikte işaretlenmesi şansın 1,2 ile 2,1 katı; aile içi kontroller 4,6 ile 12,8. Doğrulayıcıda `sx` ile P(0|1) 3 sd'de 1,54, 2 sd'de 1,07: etki uç kuyrukla sınırlı ve çift başına 80 ile 110 ortak işaretli kübit-güne dayanıyor."],"charts":[{"id":"vario-koherans-okuma","type":"line","title":"Uzun gecikme yarıvaryansının büyük kısmı ilk ölçülebilir gecikmede var (RO'da 0,43)","subtitle":"Log10 değerlerin yarıvaryansı, her ailenin kendi belgesindeki uzun gecikme düzeyine bölünmüş (`T1`, `T2` ve RO için 744 ile 1.488 saat kutusu, `sx` için 744 ile 3.624 saat). `T1`, `T2` ve `sx` için 18 saatten başlayan kutular (155 ile 156 kübit, x ortalama gecikme); RO için yalnızca gün içi oturumlar, 2 ile 4 saatten başlayan 5 kutu (x kutu ortası).","read":"Her eğrinin ilk noktası, uzun gecikme düzeyinin ne kadarının bir günde (RO için 2 ile 4 saatte) zaten bulunduğunu gösteriyor: `T1` 0,817, `T2` 0,791, `sx` 0,81, RO 0,433. Geri kalanı haftalar ile aylar içinde azalan hızla ekleniyor. Hiçbir eğri düz değil (sabit düzey artı gürültü) ve hiçbiri gecikmeyle orantılı büyümüyor (rastgele yürüyüş): yavaş kayan bir düzey artı büyük bir nugget.","caveat":"`T1` ve `T2` için 2 ile 18 saat arasındaki havuzlanmış kutular çizilmedi: 6 ile 9 saatteki 447 çiftin 302'si 2026-05-30 öncesindeki sakin döneme düşüyor, bu yüzden gün altı hafıza olarak okunamaz (02 §4.1). Kısa kutular ve paydalar ailelere göre farklı; karşılaştırma yalnızca büyüklük mertebesinde (00 §4.1).","source":"00 §4.1; 02 §4.1; 03 §4.3; 04 §4; results/coherence/nonpersistent.json (variograms.log10_T1/T2.all), results/gates_1q/sx_variogram.json (variogram_all), results/readout/noise.json (variograms.ro_log10.mixed_only)","x":{"label":"G zayıflattı). `cz` ve `rzz` için gün altı kutular ayrı grafikte.","source":"00 §4.1; 05 §4.1, §4.3; 06 §4 and Verification; results/gates_2q/variograms.json (cz, rzz, abs_zz), results/device/layer_fidelity.json (variogram.lf_100)","x":{"label":"Gecikme","scale":"log","unit":"saat"},"y":{"label":"Yarıvaryans / uzun gecikme düzeyi","scale":"linear","min":0},"markers":[{"axis":"y","value":1,"label":"uzun gecikme düzeyi"}],"series":[{"name":"cz","points":[[25.138,0.6404],[35.724,0.6377],[49.381,0.6904],[71.071,0.7349],[109.801,0.772],[168.059,0.8062],[285.858,0.8716],[552.276,0.9242],[1100.729,0.9735],[2213.09,1.026]],"style":"line+dots"},{"name":"rzz","points":[[25.132,0.5395],[35.443,0.5432],[49.848,0.5948],[71.52,0.6428],[108.605,0.698],[167.587,0.7779],[284.566,0.8788],[550.471,0.9813],[1107.308,1.054],[2250.685,0.9456]],"style":"line+dots"},{"name":"|zz| (dosya zamanı)","points":[[1.533,0.6018],[3.164,0.7924],[4.949,0.8895],[7.485,0.8718],[10.526,0.7944],[14.964,0.809],[24.076,0.8106],[36.008,0.8181],[48.008,0.8027],[69.028,0.8236],[107.68,0.8332],[167.801,0.8565],[286.734,0.8851],[549.732,0.8711],[1105.876,0.9429],[2188.823,1.057]],"style":"line+dots"},{"name":"lf_100","points":[[26.739,0.8164],[52.563,0.6629],[72.922,0.6807],[110.823,0.5948],[167.524,0.8703],[286.835,0.9289],[551.917,0.939],[1088.446,1.0],[1882.005,1.291]],"style":"line+dots"}]},{"id":"kisa-gecikme-payi","type":"bar","orient":"h","title":"Aileler en kısa gecikmede uzun gecikme düzeyinin 0,43 ile 0,82'sini taşıyor","subtitle":"En kısa kullanılan kutudaki yarıvaryansın sahibin uzun gecikme düzeyine oranı, klasik ve sağlam (Cressie-Hawkins) kestiriciyle; parantezde en kısa kutu. Okuma alanları için sağlam oran belgede verilmiyor.","read":"Varlık ailelerinde klasik oran 0,433 (RO, gün içi) ile 0,817 (`T1`) arasında; `lf_10` 0,94 ile bunun üstünde. Her ailede bileşenin büyük kısmı ilk ölçülebilir gecikmede orada. Sağlam oran `T1`, `T2` ve `lf_100` için belirgin biçimde düşük, `sx` ve `|zz|` için yüksek nlamına geliyor.","read":"`sx` ile P(0|1) 0 ile 0,5 saatte 0,108 (1.530 çift), 6 saatten sonra sıfırdan ayırt edilemiyor; `cz` ile `rzz` 1 saat içinde 0,205 (5.424 çift), 2 ile 12 saatte 0,04 ile 0,08; `sx` ile `T1` 1 saat içinde 0,096 (9.826 olay), 1 ile 6 saatte 0,024. Ayrı deneylerin bağımsız kestirim hataları hiçbir aralıkta korelasyon üretmez.","caveat":"Zaman ölçeği kurulmuş değil. Düzey penceresi ±2 güne inince `sx` ile P(0|1) en kısa kutuda 0,032'ye düşüyor: 2 ile 7 günde hareket eden ortak bir düzey de aynı kısa aralık korelasyonunu üretir (07 doğrulama, iddia 1). `sx` ile `T1` yakın-uzak farkı aynı kalibrasyon işi ile farklı iş ayrımına da uyuyor (04 doğrulama). `cz`-`rzz` düşüşü tur başına da sürüyor (104 tur, Spearman -0,393), ama 12 ile 24 saatteki 0,099 tümseği açıklanmadı. Kutular farklı olaylardan oluşuyor; kontrollü bir sönüm ölçümü değil.","source":"07 §4.2 and Verification claim 1; 05 §4.4 and Verification; 04 §7 and Verification; results/cross/comovement.json (pairs sx-p10 by_gap), results/verify/cross/comovement_check.json (gap_bins_stress_sx_p10.W2d), results/gates_2q/cz_vs_rzz.json (changes.local_deviation_spearman_by_abs_offset), results/gates_1q/sx_coherence.json (within_by_stamp_offset.T1)","x":{"label":"İki ölçüm arasındaki süre","scale":"log","unit":"saat"},"y":{"label":"Korelasyon","scale":"linear"},"markers":[{"axis":"y","value":0,"label":"bağımsız hatalar"}],"series":[{"name":"sx ile P(0|1), ±7 gün düzey","points":[[0.25,0.1083],[1.25,0.0692],[4.0,0.0276],[12.0,0.0082],[24.0,0.0083]],"style":"line+dots"},{"name":"sx ile P(0|1), ±2 gün düzey (doğrulayıcı)","points":[[0.25,0.0317],[1.25,0.0582],[4.0,0.0046],[12.0,0.0021],[24.0,-0.0064]],"style":"line+dots"},{"name":"cz ile rzz, aynı kuplör","points":[[0.5,0.2047],[1.5,0.172],[3.0,0.0783],[5.0,0.044],[9.0,0.0594],[18.0,0.0989],[36.0,-0.0156]],"style":"line+dots"},{"name":"sx ile T1, -ρ","points":[[0.5,0.0958],[3.5,0.0235]],"style":"line+dots"}]},{"id":"ortak-kubit-adim","type":"bar","orient":"v","title":"Kuplör sapmaları yalnızca bir kübiti paylaştıklarında birlikte hareket ediyor","subtitle":"İki kuplörün aynı turdaki sapmaları (komşu medyanından ve tur medyanından arındırılmış) arasında Spearman korelasyonu, kuplörler arası adım sayısına göre. 1 adım: bir kübiti paylaşan 244 kuplör çifti (29.513 eşleşme, `cz`); 4 ve üstü: 13.886 çift.","read":"Bir kübiti paylaşan kuplörlerde `cz` 0,220, `rzz` 0,225; çift başına medyan 0,209 ve 0,228; en az 30 turu olan 230 çiftin yüzde 91'inde pozitif. 2 adımda korelasyon sıfıra iniyor (-0,008 ve -0,019). `cz` için aynı sapmaların 1 ve 2 tur gecikmeli korelasyonu -0,035 ve -0,050: detrendlemeden sızan yavaş ortak bir kayma değil.","caveat":"Paylaşılan kübitin bildirilen `sx`, `T1` ve okuma sapmaları bunu açıklamıyor (kısmi korelasyon 0,219 ve 0,225), ama o değerler başka turlarda ölçüldü; \"tek kübit etkisi değil\" desteklenmiyor. Paylaşılmayan çoğunluk karakterize edilmedi; kübitin fiziksel durumu ile her iki deneye ortak bir kalibrasyon girdisi ayrılamıyor.","source":"05 §4.4 and Verification; 00 §4.1 item 5; results/gates_2q/spatial.json (*_deviation_correlation_in_space), results/verify/gates_2q/challenge_check.json (a_shared_qubit_correlation.*.by_hop, cross_round)","x":{"label":"Kuplörler arası adım","scale":"band"},"y":{"label":"Spearman korelasyonu","scale":"linear"},"categories":["1 (ortak kübit)","2","3","4 ve üstü"],"series":[{"name":"cz","values":[0.2196,-0.0084,-0.0097,-0.0079]},{"name":"rzz","values":[0.2255,-0.0191,-0.0198,-0.0083]}]},{"id":"gun-alti-birikim","type":"bar","orient":"v","title":"Gün altı birikim en açık `cz` ve `rzz`'de; `sx` 6 saatte tek tur düzeyine yakın","subtitle":"Gün altı gecikme kutusundaki log10 yarıvaryansın 18 ile 30 saat (tek tur) değerine oranı. `cz` 11, `rzz` 6 cihaz geneli ikinci ölçüm olayından (bir turdan 3 ile 16 saat sonra); `sx` havuzlanmış kutular (en kısa olay aralığı 6,31 saat, 6 ile 9 saatte 456 çift).","read":"`cz` tek tur değerinin 2 ile 4 saatte 0,33'ünde, 6 ile 9 saatte 0,64'ünde, 9 ile 12 saatte 0,73'ünde, 12 ile 18 saatte 0,89'unda; `rzz` 2 ile 4, 6 ile 9 ve 12 ile 18 saatte 0,30, 0,72 ve 0,99. `sx` ise 6 ile 9 saatte 0,97 (önyükleme yüzde 95 aralığı 0,73 ile 1,29): bu gecikmede bir yükseliş görülmüyor. Arşivin bileşeni saatler içinde birikirken gösterdiği en açık yer `cz` ve `rzz`.","caveat":"05 §4.2'nin \"ikinci kalibrasyonlar\" adı ve kısa aralıktaki değişimin öncekinden küçük olduğuna dair kuplör çifti düzeyindeki p-değerleri doğrulamada çürütüldü (sözde yineleme); olay düzeyinde işaret testi p = 0,065 (`cz`, 11 olay) ve 0,69 (`rzz`, 6 olay). 2 ile 4 saat kutusu her ailede tek bir olay. Yükselişin cihazın korelasyon zamanı mı, olaylar arasındaki yeniden kalibrasyon mu olduğu ayrılamıyor. `rzz` ve `sx` oranları bu raporda variograms.json kutularından hesaplandı.","source":"05 §4.2 and Verification; 04 §4 and Verification; 00 §4.1 item 2; results/verify/gates_2q/challenge_check.json (b_short_gap_fraction_of_one_round_cz, b_occasion_level), results/gates_2q/variograms.json (rzz.variogram), results/gates_1q/sx_variogram.json (variogram_all, bins_bootstrap)","x":{"label":"Gecikme kutusu","scale":"band"},"y":{"label":"Yarıvaryans / tek tur değeri","scale":"linear","min":0},"markers":[{"axis":"y","value":1,"label":"tek tur (18 ile 30 saat)"}],"categories":["2-4 sa","6-9 sa","9-12 sa","12-18 sa"],"series":[{"name":"cz","values":[0.334,0.637,0.734,0.885]},{"name":"rzz","values":[0.297,0.719,null,0.986]},{"name":"sx","values":[null,0.971,0.914,1.046]}]},{"id":"buyuk-sapma-cakisma","type":"forest","title":"Büyük sapmalar aynı kübit-günde şanstan sık çakışıyor, ama etki uç kuyrukta","subtitle":"Aynı operasyon gününde iki farklı ailenin kendi EWMA düzeyinden 3 sağlam sd'den büyük sapmasının birlikte görülme sayısının, bayrakları o gün gözlenen kübitler arasında karıştıran boş hipotezin ortalamasına oranı (lift); yüzde 95 aralık 2.000 kübit önyüklemesinden; çift başına 6.984 ile 21.540 kübit-gün. Log ölçek, 1 = şans.","read":"Sahibin 3 sd tanımıyla aileler arası lift 1,22 (`T2` ile P(1|0)) ile 1,96 (`sx` ile `m2`) arasında; aynı aile içindeki kontroller çok daha yüksek (`T1` ile `T2` 9,31, RO ile P(0|1) 4,63). Boş hipotez her günün cihaz geneli bayrak sayısını koruduğu için, 3 sd eşiğinde 1'in üstündeki kısım cihaz genelindeki kötü günlerle açıklanmıyor.","caveat":"Doğrulayıcıya göre etki eşiğe bağlı: `sx` ile P(0|1) kendi tanımıyla 3 sd'de 1,54, 2 sd'de 1,07 (p = 0,040). Her çift 80 ile 110 ortak işaretli kübit-güne dayanıyor ve `T2` ile RO doğrulayıcının tanımında 2026-08-01'den sonra 1,01. `zz` ile `T1`, `T2` ve `sx` çiftlerinde aralık 1'i içeriyor; `sx` ile `m2` ve `zz` ile `m2` yalnızca kübit boş hipotezini geçiyor, zaman boş hipotezini geçmiyor. Bağımsız fit hataları çakışma üretemez, ama birkaç günlük ortak bir düzey adımı ya da ortak bir kalibrasyon durumu üretebilir.","source":"07 §7.4, §4.5 and Verification claim 3; results/cross/coincidence.json (pairs[*].big_lag0.lift_qubit, lift_qubit_ci95), results/verify/cross/coincidence_check.json","x":{"label":"Lift (gözlenen / boş hipotez)","scale":"log"},"ref":1,"rows":[{"label":"T2 ile RO","est":1.263,"lo":1.033,"hi":1.512,"group":"T2 ile okuma"},{"label":"T2 ile P(1|0)","est":1.219,"lo":0.988,"hi":1.481,"group":"T2 ile okuma"},{"label":"T2 ile P(0|1)","est":1.269,"lo":1.022,"hi":1.524,"group":"T2 ile okuma"},{"label":"sx ile RO","est":1.502,"lo":1.186,"hi":1.822,"group":"sx ile"},{"label":"sx ile P(0|1)","est":1.592,"lo":1.25,"hi":1.92,"group":"sx ile"},{"label":"sx ile P(0|1), 3 sd (doğrulayıcı)","est":1.536,"group":"sx ile"},{"label":"sx ile P(0|1), 2 sd (doğrulayıcı)","est":1.074,"group":"sx ile"},{"label":"sx ile m2","est":1.957,"lo":0.898,"hi":3.152,"group":"sx ile"},{"label":"zz ile T1","est":1.524,"lo":0.989,"hi":2.23,"group":"zz ile"},{"label":"zz ile T2","est":1.354,"lo":0.905,"hi":1.899,"group":"zz ile"},{"label":"zz ile sx","est":1.343,"lo":0.851,"hi":1.96,"group":"zz ile"},{"label":"zz ile RO","est":1.601,"lo":1.411,"hi":1.818,"group":"zz ile"},{"label":"zz ile P(1|0)","est":1.425,"lo":1.206,"hi":1.65,"group":"zz ile"},{"label":"zz ile P(0|1)","est":1.626,"lo":1.409,"hi":1.854,"group":"zz ile"},{"label":"zz ile m2","est":1.826,"lo":1.199,"hi":2.46,"group":"zz ile"},{"label":"T1 ile T2","est":9.307,"lo":8.12,"hi":10.505,"group":"aile içi kontrol"},{"label":"RO ile P(0|1)","est":4.633,"lo":4.462,"hi":4.809,"group":"aile içi kontrol"}]}],"toc_tr":"Kök soru"},{"section":"koherans","toc_tr":"Koherans","title_tr":"Koherans: `T1`, `T2` ve onlardan türeyen hızlar","intro_tr":["Bir kübitin `T1` ve `T2` değerleri aynı turda, saniyeler arayla damgalanıyor: 19.899 eşli olayın hepsinde `T2` damgası `T1` damgasından 1 ile 112 s sonra geliyor. IBM `T2`'yi Hahn yankısından raporluyor; bu yüzden `Gamma_phi = 1/T2 - 1/(2 T1)`, yankıdan sonra kalan saf faz kaybı hızıdır. Arşivde değer başına fit belirsizliği yok.","İki alanın yapısı farklı. `T2` büyük ölçüde kübite özgü bir sabit gibi davranıyor; `T1`'in log varyansının ise yalnız 0,386'sı kübitler arasında, kalanı aynı kübitte turdan tura değişim. Bu değişimin görünür bir parçası, seviyenin en az 2 kat altına inen ve çoğunlukla bir sonraki turda geri dönen `T1` dipleri; `T2` bu diplerde de düşüyor.","Aynı turdaki `T1` ve `T2` sapmaları 0,70 korelasyonlu. İki fitin hataları birbirinden bağımsızsa bu, her sapmanın varyansının en az yarısının iki fit arasında paylaşıldığını gösterir. Paylaşılan parçanın kübitin gerçek değişimi mi yoksa IBM yönteminde iki deneye ortak bir etki mi olduğunu arşiv ayıramıyor (02 Doğrulama); paylaşılmayan kalanın ne olduğu da bilinmiyor ve ona tahmin gürültüsü denmiyor."],"bullets_tr":["**Varyansın yeri.** log `T1` varyansının 0,386'sı kübitler arasında; `T2` için 0,817, `Gamma_phi` için 0,882 (`T1` için 20.063, `T2` için 20.626 olay). Hangi kübit olduğunu bilmek `T2`'yi büyük ölçüde, `T1`'in yarıdan azını belirliyor.","**Komşu yapısı tespit edilmedi.** Kübit medyanı log `T1` için Moran's I -0,017 (p = 0,86, 156 kübit). Tur medyanı `T1` sapmalarının varyansının yalnız %5,5'ini açıklıyor; bağlı çiftlerin artık korelasyonu (-0,005) dört ve daha fazla adım uzaktaki çiftlerinkine (-0,004) eşit.","**`T1` dipleri.** 19.595 `T1` olayının 630'u (%3,2; 151 kübit) kayan seviyenin en az 2 kat altında. 602 epizodun 574'ü tek olay; toparlanma medyanı 25,0 saat, yani bir sonraki tur. Tek turluk olmaları veriyle tutarlı, kanıtlanmış değil (28 art arda dip çifti, karıştırmada ortalama 21,6, p = 0,10).","**`T2` dipleri izliyor.** Eşli 621 dip olayının %97,9'unda `T2` de seviyesinin altında, medyan -0,234 dekad; yalnız `T1` düşüşünden beklenen -0,194 dekad (Spearman 0,81). Bu iki fit arasında paylaşılan bir değişim; ortak bir yöntem etkisi dışlanmadı.","**`T2 > 2 T1` nadir.** 19.899 eşli olayın 20'si (%0,10; 15 kübit). Bu olaylarda `T1` seviyesinin yaklaşık 0,30 dekad altında, `T2` seviyesinde: `T2`'nin izlemediği bir `T1` düşüşü. Kayıt düzeyinde 424 kayıt (18 kübit).","**Bayat değerler.** `q72` `T1` (1.126 dosyada 72 saatten eski), `q11` `T1` (876), `q17` `T1` (482 dosya, en çok 2.206 saat, 14 Temmuz'a kadar) ve `q149` `T2` (351) yeniden ölçülmeden taşındı.","**ADR-027 lambda'sı yoğunlaşıyor.** Faz kaybı en güçlü %10 kübit, dosya başına anlık lambda toplamının medyan %48'ini taşıyor (yarıya yakın, 1.760 dosya); gamma için %20.","**Saat ya da gün etkisi yok.** Tur düzeyinde Kruskal-Wallis p: saat için 0,69 (`T1`) ve 0,95 (`T2`), haftanın günü için 0,89 ve 0,86; sekiz testin hiçbiri Bonferroni eşiği 0,00625'i geçmiyor (133 tur)."],"charts":[{"id":"koh-dagilim","type":"hist","title":"`T1` ve `T2` dağılımları düşük değerlere doğru uzanıyor","subtitle":"Olay başına `T1` (20.063 olay, 156 kübit) ve `T2` (20.626 olay, 155 kübit), µs; log10 ekseninde 0,05 dekadlık kutular","read":"`T1` medyanı 126 µs; medyan yüzde 1'lik dilimin (39,5 µs) 3,19 katı, yüzde 99'luk dilim (261 µs) medyanın yalnız 2,07 katı. Bu asimetrik alt kuyruk `T1` dipleridir. `T2` (medyan 92,9 µs, yüzde 1'lik dilim 6,46 µs) gövdesinde de çar bilir kübitlerin gamma ya da lambda toplamı) en büyük paylı kübitlerce taşınan kısmı: 1.760 dosyanın medyanı, çizgiler yüzde 10 ile yüzde 90 dilimleri; eşit dağılım karşılaştırma için","read":"Faz kaybı en güçlü %10 kübit (16 kübit) lambda toplamının medyan %48'ini taşıyor (dosyaların yüzde 10 ile 90'ı arasında %46 ile %52), gamma toplamının %20'sini. Ortalama/medyan oranı lambda'da 2,30, gamma'da 1,12. Anlık lambda hedefi bu yüzden birkaç kübitin faz kaybını yarıya yakın ağırlıkla yansıtıyor.","caveat":"Doğrulayıcı \"anlık lambda çoğunlukla 16 kübitin ifadesidir\" sözünü abartılı buldu: medyan pay %48, yarının altında; \"çoğunluk\" en çok dosyaların yarısında doğru. Doğru okuma \"yarıya yakın\".","source":"02 §8 ve Doğrulama; results/coherence/adr027.json (gamma, lambda: all_files, share_of_sum_*)","x":{"label":"Kübit grubu","scale":"band"},"y":{"label":"Toplamdaki pay","scale":"linear","min":0,"max":0.6},"categories":["En büyük tek kübit","En büyük %5","En büyük %10"],"series":[{"name":"lambda (faz sönümü)","values":[0.091,0.35,0.485],"lo":[0.079,0.32,0.455],"hi":[0.113,0.384,0.522]},{"name":"gamma (genlik sönümü)","values":[0.021,0.121,0.203],"lo":[0.017,0.106,0.184],"hi":[0.045,0.154,0.239]},{"name":"Eşit dağılım","values":[0.0065,0.05,0.1]}]},{"id":"koh-mevsimsellik","type":"bar","title":"Turun saatine göre `T1` ve `T2` seviyesi değişmiyor","subtitle":"Cihaz tur sapmasının (kübitlerin kendi tüm geçmiş medyanlarından log sapmalarının tur medyanı) dört saatlik UTC dilimlerinde medyanı, dekad; 133 büyük tur. Eksen, turdan tura `T1` cihaz sapmasının yüzde 10 ile 90 dilimlerini (-0,095 ile +0,054 dekad) içerecek genişlikte","read":"Dilim medyanları arasındaki en büyük fark 0,013 dekad (yaklaşık %3). Kruskal-Wallis p: saat için 0,69 (`T1`) ve 0,95 (`T2`), haftanın günü için 0,89 ve 0,86. `Gamma_phi` ve `s` dahil sekiz testin hiçbiri Bonferroni eşiği 0,00625'i geçmiyor.","caveat":"Bir tur saniyeler içinde damgalandığı için \"saat\", turun yazılma saatidir; turlar 20:00 ile 24:00 arasında yoğunlaşıyor (133 turun 46'sı). Tek tek olaylara bakan tablo betimleyicidir, çünkü bir turun olayları bağımsız değil.","source":"02 §3.4; results/coherence/temporal.json (T1/T2.seasonality_rounds, multiple_testing)","x":{"label":"Turun UTC saati","scale":"band"},"y":{"label":"Medyan tur sapması","scale":"linear","unit":"dekad","min":-0.1,"max":0.1},"markers":[{"axis":"y","value":-0.095,"label":"turdan tura `T1` sapmasının %10 dilimi"},{"axis":"y","value":0.054,"label":"%90 dilimi"}],"categories":["00-04 UTC (21 tur)","04-08 UTC (16 tur)","08-12 UTC (22 tur)","12-16 UTC (9 tur)","16-20 UTC (19 tur)","20-24 UTC (46 tur)"],"series":[{"name":"T1","values":[0.0094,0.0119,0.0082,0.0089,0.0213,0.0161]},{"name":"T2","values":[0.0085,0.0073,0.0124,0.0106,0.0073,0.01]}]}]},{"section":"readout","title_tr":"Okuma ve ölçüm: atama hataları, oturumlar, okuma süresi deneyi, eşikler","intro_tr":["Bu bölüm `ibm_fez`'in okuma alanlarını ele alır: P(0|1) (`prob_meas0_prep1`, |1> hazırlanıp 0 okunması), P(1|0) (`prob_meas1_prep0`), atama hatası RO (`readout_error`, `measure` hatasıyla kayıt kayıt aynı), asimetri A = P(0|1) - P(1|0), okuma süresi t_ro, `init_error`, `measure_2` ve ayırt etme eşikleri. Temel: 1.760 anlık görüntü dosyası, 156 kübit, 598 okuma oturumunda 91.896 RO damga olayı.","Okuma, değerleri bir sayımdan geldiği için binom atış gürültüsü hesaplanabilen tek ailedir. Atış gürültüsü, onun ötesindeki kalıcı olmayan bileşen ve variogramlar ana bölümde ele alınır; burada alanların nasıl üretildiği, iki doğal deney, `T1` bozunmasıyla bağ, ilgili alanlar ve uzamsal yapı var.","Yedi sahip betiğinin hepsi doğrulamada alan alan yeniden üretildi. Dört iddia zayıfladı (bayat P(0|1) için ızgara testi, 'dama tahtası', yarım pencere bozunması, 2^-312 parite olasılığı), biri ikiye ayrıldı (06-08 RO düşüşü ayakta, A kısmı zayıf), hiçbiri çürütülmedi. Aşağıdaki metin ve grafikler düzeltilmiş okumaları kullanır."],"bullets_tr":["**RO, P(0|1) ile P(1|0)'ın ortalamasıdır**, üç değer aynı oturumdan geldiğinde: 188.100 özdeş ve 72.900 kademeli damgalı kaydın hepsinde tutar; bozulduğu 11.263 kaydın %99,956'sı P(0|1)'i medyan 11,57 saat eski olan kayıtlardır.","**Dönen 9 kübitlik grup:** P(0|1)'i gün içinde yenilenmeyen grup hep aynı mod 17 kalanındaki 9 kübittir (10, 2026-07-25'te 9, 2026-08-25'te 16). Mekanizma çıkarımdır; örtük değerin 1/4096 ızgarasına düşmesi aritmetik olarak kaçınılmazdır ve kanıt sayılmaz.","**İki oturum türü:** en az 100 kübitli 589 oturumun 123'ünde her sayım çift, 466'sında yaklaşık yarısı. Çift oturumların %87,0'ı bir `T1` turuna 3 saatten yakın (karışıklarda %15,7); bu oturumların 2.048 atış kullanıp kullanmadığı açık. Eşik değişiklikleri çoğunlukla gün içi oturumlarla gelir (343'ün 208'i, günlüklerde 97'nin 20'si) ve her biri 156 kübitin hepsini birlikte değiştirir (327 dosya).","**2026-06-08 (t_ro 1.560 -> 1.700 ns) güçlü bir doğal deneydir:** kübit başına RO medyan -0,137 dekad, kübitlerin yalnızca %1,9'u yükseldi, 104 plasebo gününün hiçbiri bu büyüklüğe ulaşmadı; P(1|0) -0,269, P(0|1) -0,079, `T1` plasebo aralığında kaldı. Ancak eşik alanı aynı dosyada başlar (uzunluk ile prosedür ayrılamaz) ve bu düşüş tek açık istisna değildir: okumanın en büyük düşüşü 2026-05-17'de bilinen bir olay olmadan görülür (10 turluk pencerede -0,20 dekad).","**2026-07-30 (1.700 -> 1.660 ns) saptanabilir bir şey oynatmadı:** RO +0,003 dekad, plasebo aralığında (-0,039 ile +0,030); öngörülen bozunma değişimi (-0,0003) verinin çözebileceğinin altında. Aylık cihaz RO'su mayısta 0,01416, haziranda 0,00854, ekimde 0,00928: düşüşün çoğu haziran ortasından önce.","**Okuma sırasındaki bozunma kübitler arasında görünür:** A, 1 - exp(-t_ro/`T1`) ile Spearman 0,423 (eğim 0,310), P(0|1) tek başına 0,016. Yarım pencere okuması desteklenmez ve 06-08'deki A artışı (+0,00146) plasebo aralığında (en büyük +0,00153). Kübit içinde günlük `T1` değişimleri P(0|1)'i oynatmaz (-0,014).","**İlgili alanlar okuma kalitesini izler:** `init_error` P(1|0) ile kübitler arasında 0,822, aynı oturumda kübit içinde 0,722; hiç taşımayan 40 kübitin medyan RO'su 0,0331, diğerlerinin 0,0071. `measure_2` hatası RO'nun medyan 1,25 katı (Spearman 0,852, kübitlerin %60,3'ünde daha kötü).","**Uzamsal yapı büyük ölçüde derece sınıfıdır:** medyan RO derece 2'de 0,00757, derece 1'de 0,01196, derece 3'te 0,01428 (p = 3,5e-7); ham Moran's I -0,196, sınıf medyanları çıkarılınca -0,047 (p = 0,59). Frekans okuması test edilemez; kübit sıralaması kararlı (haziran ile eylül 0,926)."],"charts":[{"id":"ro-stamp-classes","type":"bar","orient":"h","title":"RO, üç değeri aynı oturumdan gelen her kayıtta P(0|1) ile P(1|0)'ın ortalaması","subtitle":"274.560 kübit kaydı, `readout_error`, `prob_meas0_prep1` ve `prob_meas1_prep0` damgalarının ilişkisine göre dört sınıf; ikinci seri RO = (P(0|1) + P(1|0)) / 2 kuralının tuttuğu kayıtlar","read":"Özdeş damgalı 188.100 (%68,51) ve aynı oturumda kademeli damgalı 72.900 (%26,55) kaydın hepsinde kural tutar; kademelide P(0|1) RO'dan medyan 81 s, P(1|0) 41 s önce damgalanır. Kuralın bozulduğu 11.263 kaydın 11.258'i (%99,956) P(0|1)'i RO'dan medyan 11,57 saat eski olan bayat kayıtlardır.","source":"03 §0 item 1, §1.3; results/readout/sessions.json: record_classes, stagger, stale_p0g1; reproduced in results/verify/readout/records_check.json","x":{"label":"Kayıt sayısı","scale":"linear"},"categories":["Özdeş damgalar","Kademeli (aynı oturum)","Bayat P(0|1)","Diğer"],"series":[{"name":"Kayıt","values":[188100,72900,11515,2045]},{"name":"Ortalama kuralı tutan","values":[188100,72900,257,2040]}]},{"id":"ro-stale-group","type":"gantt","title":"P(0|1)'i gün içinde yenilenmeyen 9 kübitlik grup döner: indis mod 17 kalanı 10, sonra 9, sonra 16","subtitle":"P(0|1)'in RO'dan 10 dakikadan eski olduğu dönemler; en az 100 bayat kaydı olan 27 kübit, kalan sınıfına göre gruplu (toplam 11.515 bayat kayıt, 35 kübit). Aralarında 48 saatten kısa boşluk olan bayat dönemler birleştirildi (boşlukların medyanı 5,5 saat)","read":"H adout/extra_check.json","x":{"label":"Derece sınıfı","scale":"band"},"y":{"label":"Medyan RO","scale":"linear"},"orient":"v","categories":["Derece 1 (8 kübit)","Derece 2 (100 kübit)","Derece 3 (48 kübit)"],"series":[{"name":"Medyan RO","values":[0.01196,0.00757,0.01428]}]},{"id":"ro-monthly-level","type":"bar","title":"Aylık cihaz düzeyi: mayıstan hazirana büyük düşüş, sonra hafif yukarı kayma","subtitle":"Her kübitin aylık medyanının kübitler üzerinden medyanı (kübit başına en az 5 olay); mayıs 18,5 gün, ekim 5,1 gün kapsar","read":"RO 0,01416 (mayıs), 0,00854 (haziran), 0,00812, 0,00836, 0,00854 ve 0,00928 (ekim). P(1|0) mayıstan hazirana yarıya iner (0,01001'den 0,00500'e) ve sonra 0,0042 ile 0,0049 arasında kalır. Değerlerde günün saatine veya haftanın gününe bağlı pratik büyüklükte bir mevsimsellik yok (epsilon-kare en çok 0,00042).","caveat":"Görünür oturum sıklığı aya göre değişir (günde 5,68'den 3,07'ye); bunun IBM'in daha seyrek ölçmesinden mi, arşivin ara belgeleri daha az görmesinden mi geldiği arşivden ayrılamaz.","source":"03 §0 item 15, §2.3, §3.1; results/readout/spatial_temporal.json: temporal.monthly_device_median_of_qubit_medians; sessions.json: by_month","x":{"label":"Ay (2026)","scale":"band"},"y":{"label":"Hata olasılığı","scale":"linear"},"orient":"v","categories":["Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim"],"series":[{"name":"RO","values":[0.01416,0.008545,0.008118,0.008362,0.008545,0.009277]},{"name":"P(0|1)","values":[0.01892,0.01172,0.01135,0.01099,0.01196,0.01331]},{"name":"P(1|0)","values":[0.01001,0.005005,0.00415,0.004883,0.004822,0.004883]}]}],"toc_tr":"Readout"},{"section":"tek-kubit","toc_tr":"Tek-kübit kapıları","title_tr":"Tek-kübit kapıları: `sx`, takma adları, `xslow` ve `rz`","intro_tr":["`sx` hatası, belgelerde tek kübitli bir üniter kapının ölçülen tek hatası: IBM onu tüm kübitlerde eşzamanlı randomized benchmarking (RB) ile türetiyor. `x`, `id`, `rx` ve `xslow` her kayıtta aynı değeri bildiriyor, dolayısıyla kübit başına tek bir tek-kübit hata serisi var. `rz` sabit (hata 0, süre 0): McKay ve diğerlerinin (2017) sanal Z kapısı.","Kübit seviyeleri 34,5 kat aralığa yayılıyor ve aylar boyunca yerinde duruyor. Seviyenin etrafında olaydan olaya hafızasız bir bileşen var: değişimlerin lag-1 otokorelasyonu -0,49, lag-2 -0,003. Bu bileşenin robust büyüklüğü 0,086 dekad, yaklaşık 1,22 kat (04 Doğrulama); gövdesi simetrik, kuyruğu yukarı yönde tek taraflı.","Kübitler arasında `sx`, `T1`'i koherans sınırından daha iyi izliyor. Aynı turda `sx` sapması `T1` sapmasıyla zayıf ama kaydırılmış eşleştirmelerin aralığı dışında kalan bir korelasyon gösteriyor (-0,062; damgalar 1 saat içindeyse -0,096). Bu, iki deney arasında paylaşılan bir parça; doğrulayıcıya göre zaman ölçeği ve fiziksel mi yoksa ortak bir SPAM ya da hazırlık kayması mı olduğu belirlenmedi. Bileşenin büyük kısmının ne olduğu bilinmiyor; ona tahmin gürültüsü denmiyor."],"bullets_tr":["**Bir ölçüm, beş ad.** `x`, `id`, `rx` 274.560 kaydın, `xslow` 136.032 kaydın hiçbirinde `sx`'ten farklı değer taşımıyor. 979, 645, 374 ve 310 tarih uyuşmazlığının hepsi `q17`, `q72` ve `q149`'un yer tutucu kayıtlarında ve fark tam 1 saniye.","**`xslow`'un çelişkisi.** 1.000 ns'lik bir talimat 24 ns'lik `sx` ile aynı hatayı bildiriyor. 1.000 ns'nin koherans sınırı bildirilen hatayı 6.033 eşli olayın %99,67'sinde aşıyor (medyan 17,2 kat; saf faz kaybı olmadan da %99,27, 8,9 kat). Eşitlik kesin; bir kopyalama mekanizması gösterilmedi.","**Dağılım ve kuyruk.** Olay başına medyan 3,10e-4 (yüzde 1: 1,42e-4; yüzde 99: 2,54e-3; 20.207 olay); %4,88'i 1e-3'ün üstünde. Kayan seviyenin 2 katından fazla üstünde %1,95, altında %0,28: kuyruk tek taraflı.","**Kararlı seviyeler.** Kayıt ikiye bölündüğünde kübit medyanlarının sıra korelasyonu 0,972 (155 kübit); kübitlerin %85,8'i aynı üçte birlik dilimde kalıyor. Cihaz geneli kayma (30 günde 0,0008 dekad) ve saat ya da gün etkisi (Kruskal-Wallis p 0,73 ve 0,50) yok.","**Koherans sınırı bir vekil.** 24 ns'lik sınır bildirilen hatanın medyanda 0,40'ı (yüzde 10: 0,18; yüzde 90: 0,99; 18.301 eşli olay); %9,8'inde 1'in üstünde ve bunlar düşük `T2`'li kübitlerde toplanıyor.","**Kübitler arasında `sx` `T1`'i izliyor.** Kübit medyanlarında log `sx` ile log `T1` arasında Spearman -0,434 (%95 güven aralığı -0,558 ile -0,291); koherans sınırıyla 0,199, `T2` ile -0,161.","**Derece etkisi.** 3. dereceli kübitlerde medyan `sx` 2,69e-4, 2. derecede 3,22e-4 (p = 0,003). Doğrulayıcıya göre `T1` aynı deseni gösteriyor (132, 125, 142 µs; p = 0,0037); etki `T1` üzerinden geçiyor olabilir, bu bir ipucu.","**Sıçramalar ve `T1` dipleri.** `sx` sıçramalarının %16,7'sinde `T1` seviyesinin 1,5 kat altında; kaydırılmış eşleştirmede ortalama %10,9, en çok %14,0. Koherans sınırı bir sıçramanın fazla hatasının yalnız medyan %0,5'ini açıklıyor."],"charts":[{"id":"tk-takma-ad","type":"bar","orient":"h","title":"`x`, `id`, `rx` ve `xslow` her kayıtta `sx` ile aynı değeri bildiriyor","subtitle":"Her takma adın `sx` ile karşılaştırılan kayıtlarında değer ve tarih uyuşmazlıkları; `id`, `rx`, `x` için 274.560, `xslow` için 136.032 kayıt. Değer uyuşmazlığı ve ölçülmüş kayıtta tarih uyuşmazlığı her takma adda 0 olduğu için çizilmedi","read":"Değer uyuşmazlığı hiçbirinde yok. Çubuklar tarih uyuşmazlıklarını sayıyor (979, 645, 374, 310); hepsi `q17`, `q72` ve `q149`'un yer tutucu kayıtlarında (bu kayıtlar `sx` için toplam 1.975, `xslow` için 915; uyuşmazlık bunların bir kısmında) ve fark daima tam 1 saniye; ölçülmüş kayıtlarda uyuşmazlık 0. Yer tutucular maskelenince her takma adın 155 serisi `sx`'inkiyle özdeş: kübit başına tek bir tek-kübit hata serisi var.","caveat":"IBM `sx`, `id` ve `x` hatalarının eşit varsayıldığını belgeliyor; `rx` ve `xslow` eşitliği yalnız arşivde gözlenen bir olgu. Doğrulayıcı `xslow` için \"`sx`'ten kopyalanmış\" sözünü zayıflattı: veri iki alanın her kayıtta eşit olduğunu gösteriyor, bir kopyalama mekanizmasını değil.","source":"04 §0, §1, §6 ve Doğrulama; results/gates_1q/aliases_and_sc  zayıf bağ (-0,062) deneyler arasında paylaşılan bir parça; zaman ölçeği ve fiziksel mi yöntemsel mi olduğu belirlenmedi (04 Doğrulama).","source":"04 §0, §7 ve Doğrulama; results/gates_1q/sx_coherence.json (coincidence)","x":{"label":"Dip tanımı","scale":"band"},"y":{"label":"Sıçramada dip oranı","scale":"linear"},"categories":["T1, 1,5 kat altı","T1, 2 kat altı","T2, 1,5 kat altı","T2, 2 kat altı"],"series":[{"name":"Sıçramada gözlenen","values":[0.1667,0.0833,0.1142,0.0525]},{"name":"Kaydırılmış, ortalama","values":[0.1093,0.0418,0.096,0.0394]},{"name":"Kaydırılmış, en büyük","values":[0.1404,0.0596,0.1384,0.0647]}]}]},{"section":"iki-kubit","title_tr":"İki kübitli kapılar ve kuplörler: `cz`, `rzz`, `jq`, `zz`","intro_tr":["Bu bölüm 176 kuplörün iki kübitli alanlarını inceler: 22.092 `cz` ve 18.210 `rzz` yeniden ölçüm olayı (yer tutucular olaylar kurulmadan önce maskelenmiş) ve 83.440 `|zz|` değer olayı. Bir kuplörün iki yönü, yer tutucular dışında değer ve tarih olarak birebir aynıdır (309.760 karşılaştırmanın hepsinde); bu yüzden her kuplör için tek bir sütun (`a < b`) kullanılır.","IBM'in belgelerine göre kuplör başına 2Q hata, aralarında en az iki kübit bulunan kenarlardan oluşan \"izolasyon\" gruplarında randomize benchmarking (RB) ile ölçülür; `rzz` hatası RZZ açıları üzerinden ortalanır ve keyfi üniterler için bir RB çeşidiyle ölçülür; 1 değeri, benchmarking birkaç gün başarılı olmadığında yazılan bayat değerdir (IBM \"View backend details\", 2026-10-06'da okundu). Arşivdeki `gate_error` değerinin tam olarak bu büyüklük olduğu bir çıkarımdır. `jq` ve `zz` hiçbir IBM kaynağında tanımlanmamış.","Her değer tek bir sayıdır ve belirsizlik taşımaz. Değerlerin bir turdan ötekine kalıcı olmayan büyük bir bileşeni vardır; bunun ne olduğu bu verilerle ayrıştırılamaz, bu yüzden burada ölçüm ya da kestirim gürültüsü diye adlandırılmaz."],"bullets_tr":["**`cz` ve `rzz` ayrı kalibrasyonlardır.** Aynı dosyada ikisinin de geçerli olduğu 296.321 kaydın hiçbirinde değerler eşit değil; `rzz` olayı `cz` olayını medyanda 1,15 saat sonra izler. Yine de aynı kuplörün kalitesini ölçerler: kuplör medyanları arasında Spearman 0,896 (170 kuplör).","**Seviyeler.** Olay medyanı 2,75 × 10⁻³ (`cz`) ve 2,66 × 10⁻³ (`rzz`); kuplör medyanları en iyiden en kötüye 42,5 (`cz`) ve 99,6 (`rzz`) kat açılır. Cihaz düzeyindeki iki kübit hata seviyesi beş ayda belirgin değişmedi (30 günlük Theil-Sen eğiminin %95 aralığı sıfırı içerir).","**Arızalar birer durumdur.** `cz`'de 7 kuplör en az bir kez yer tutucuda (her zaman: 4; giriş: 2), `rzz`'de 13 (her zaman: 5; giriş: 13). 32-33 iki kapıda da kalıcı arızalı, oysa iki kübitinin raporlanan medyanlarının hiçbiri uç değil (yüzdelik 23 ile 87 arası).","**Koherans sınırı hatanın yaklaşık üçte biri.** Olay başına sınır/hata oranının medyanı 0,333 (`cz`) ve 0,351 (`rzz`); sınır, saatler uzakta ölçülmüş `T1` ve `T2`'den kurulan bir vekildir.","**Kuplörün seviyesi en çok kübitlerinin `sx` hatasıyla birlikte gider.** Kuplörler arası Spearman: `sx_a + sx_b` ile 0,577, koherans sınırıyla 0,334; okuma, ikisi verildiğinde -0,012 ekler. Bu bir korelasyondur, \"açıklar\" denemez.","**`jq` bilgi taşımaz:** 309.760 kaydın hepsinde 0. **Kapı süreleri yapılandırma değeridir:** kuplörlerin çoğunda 68 ns; 102-103 ve 146-147'de 88 ns; üç kuplörde `rzz` 116 ns; 71-72 ve 72-73'te, her dosyada yer tutucudayken, 2026-09-05'ten beri 84 ns. Süre hatayı tek başına belirlemez: 88 ns'lik 146-147'nin `cz` kayıt medyanı 2,71 × 10⁻³ (68 ns kayıtlarında 2,75 × 10⁻³), 102-103'ünkü 7,41 × 10⁻².","**`zz` statik ZZ'dir (birimi GHz; kayıt medyanı 6,18 kHz) ve tüm cihazda yaklaşık 5 saatte bir yenilenir.** 486 patlamanın 484 tanesi en az 170 kuplörü değiştirir, aralık medyanı 5,16 saat. `cz` ve `rzz` hatasıyla ilişki saptanmadı (0,010 ve -0,027); köprü kuplörlerde 1,42 kat büyüktür; üç kuplör 2026-07-10'dan beri donuk.","**Uzayda öbeklenme.** Kuplör seviyeleri grafikte öbeklenir: Moran's I `cz` için 0,263, `rzz` için 0,383; `|zz|` için öbeklenme saptanmadı (-0,002)."],"charts":[{"id":"cz-rzz-kuplor-medyanlari","type":"scatter","title":"`cz` ve `rzz` aynı kuplörün kalitesini ölçer, ama biri ötekinin kopyası değildir","subtitle":"Kuplör başına olay medyanı: x `cz` hatası, y `rzz` hatası (log-log; 170 kuplör; yer tutucular maskeli). Çizgi y = x.","read":"Noktalar köşegen çevresinde dar bir bantta: kuplör medyanları arasında Spearman 0,896, `rzz/cz` oranının medyanı 0,968 (`rzz` medyanı daha düşük olan kuplörlerin payı %60,6). Uçlar: 31-32'de `rzz`, `cz`'nin 0,217 katı; 148-149, 149-150 ve 102-103'te 1,64 ile 1,72 katı. Aynı dosyada ikisinin de geçerli olduğu 296.321 kaydın hiçbirinde iki değer eşit değil.","source":"05 §1.1, §7.1; results/gates_2q/cz_vs_rzz.json (levels)","x":{"label":"`cz` hatası (kuplör medyanı)","scale":"log"},"y":{"label":"`rzz` hatası (kuplör medyanı)","scale":"log"},"diag":true,"series":[{"name":"kuplör","points":[[0.009256,0.009781],[0.002457,0.002201],[0.001982,0.00181],[0.002146,0.002136],[0.002413,0.002327],[0.002785,0.002441],[0.00792,0.006764],[0.002715,0.002991],[0.002897,0.003285],[0.003028,0.003555],[0.002181,0.002277],[0.001905,0.001916],[0.009946,0.009517],[0.007824,0.008794],[0.01283,0.01237],[0.005075,0.004219],[0.001917,0.001786],[0.002023,0.00231],[0.00293,0.002703],[0.00332,0.002902],[0.02789,0.0371],[0.002933,0.002611],[0.002285,0.002161],[0.004038,0.003492],[0.002647,0.002176],[0.00663,0.005008],[0.001859,0.0018],[0.007078,0.006118],[0.0245,0.02074],[0.002444,0.002385],[0.002041,0.001989],[0.03006,0.03517],[0.003905,0.002889],[0.002297,0.002613],[0.002112,0.00217],[0.002885,0.003039],[0.04014,0.008706,"31-32"],[0.002479,0.002322],[0.00184,0.001838],[0.002041,0.002324],[0.002336,0.002417],[0.002062,0.002139],[0.003384,0.004479],[0.006794,0.004134],[0.002093,0.002597],[0.002773,0.002513],[0.003159,0.003162],[0.002695,0.002207],[0.002545,0.002112],[0.002066,0.002308],[0.002966,0.003041],[0.002916,0.002984],[0.002106,0.002048],[0.00509,0.00436],[0.004257,0.004172],[0.004085,0.00 da negatif; haritada mutlak değer"},"edge_label":"`|zz|` (kHz)"}],"toc_tr":"İki-kübit kapıları"},{"section":"cihaz","title_tr":"Cihaz ve zaman: takvim, değişim noktaları, arızalar, yerleşim ve layer fidelity","intro_tr":["Bu bölüm belgelerin kendisini, IBM'in kalibrasyon takvimini, cihaz geneli değişimleri, arıza haritasını, heavy-hex yerleşimini ve layer fidelity'yi (`lf_N`) inceliyor (06). Takvim IBM'in hiçbir kaynağında tarif edilmiyor; aşağıdaki takvim ifadelerinin hepsi kayıt damgalarından çıkarım.","Günlük döngü 24 saatten biraz uzun (24,7 ile 25,3 saat) ve saatin etrafında dolaşıyor; yeniden başlatmalar onu geri çekiyor. Bir döngü içinde sıra sabit: readout ve `measure_2`, saniyeler arayla `T1` ve `T2`, yaklaşık bir saat sonra `sx`, saatler sonra `cz` ve `rzz`. `lf` kendi 26,5 saatlik döngüsünde.","Cihaz medyanlarındaki değişim noktaları bilinen olaylarla ancak şans düzeyinde örtüşüyor. Kalıcı arızalı kuplörler iki kübit çevresinde birleşiyor (`q72`, `q99`). Katmanlı zincirlerde ölçülen hata, aynı zincirin izole `cz` değerlerinden beklenenin yaklaşık 1,4 katı; nedeni açık."],"bullets_tr":["**Döngü**: `T1` için 133 ana tur, medyan aralık 24,71 saat, her gün 0,73 saat daha geç; `cz` 1,11, `rzz` 1,16, `lf` 2,43 saat (06 §3.1).","**Bir tur birkaç saniyelik damga grubu**: `sx`, `T2` ve `xslow` gruplarında hiç komşu kübit çifti yok (`sx` için 0, rastgele beklenti 5.657); readout ve `T1` grupları kübit indeks sırasını izliyor (06 §3.3). Damgalar ölçüm değil yazım zamanı gibi davranıyor (yorum).","**Kapsam ve kadans**: belge/gün 9,25'ten 22,77'ye çıkarken görünen readout turu/gün 5,62'den 3,67'ye indi; düşüş yalnızca canlı belgeli aylarda da var (06 §3.4, Doğrulama).","**Değişim noktaları**: en tutucu cezada 17 noktanın 5'i bilinen bir olaya 36 saat içinde, şansla beklenen 3,29. 8 Haziran readout düşüşü (−0,138 dekad) tek olay ve atfedilemiyor; en büyük düşüş 17 Mayıs'ta, bilinen olay yok (06 §3.5, Doğrulama).","**Açıklanmamış bölüm**: `init_error` 21 Ağustos'ta 0,225 dekad yükselip 31 Ağustos'ta 0,300 dekad düşüyor; aynı tarihlerde readout noktaları var, bilinen olay yok (06 §3.5).","**Durumlar**: 760 ayrık durum kübit kaydı durumu; aynı durumdaki 998 ardışık çiftin 314'ünde bir kapı, `lf`, `zz` ya da eşik değişiyor (06 §2.4, §7.1).","**Arızalar**: 6 kalıcı arızalı kuplörden 2 bitişik çift `q72` ve `q99` üzerinden (p = 0,018); \"uzamsal yoğunlaşma\" yalnızca düşündürücü (p = 0,042; 0,16) (06 §5.2, Doğrulama).","**Layer fidelity**: `lf_100` medyanı 0,545, EPLG(100) 0,00489 ve zamanla artıyor; katmanlı hata izole `cz` tahmininin 1,36 ile 1,41 katı, N'den bağımsız; 83 olayda 59 farklı `lf_100` zinciri (06 §2.5, §7.1, §7.2)."],"charts":[{"id":"cihaz-saat","type":"line","wide":true,"title":"Günlük döngü 24 saatten uzun: turlar her gün biraz daha geç başlıyor","subtitle":"Her ana turun başlangıç saati (UTC) tarihe karşı; `T1` 133, `cz` 130, `rzz` 109 ana tur ve 82 arşiv içi `lf` olayı","read":"Nokta dizileri her gün yukarı kayıyor ve 24'e varınca alttan yeniden başlıyor: `T1` turları medyan 0,73 saat, `sx` 0,89, `cz` 1,11, `rzz` 1,16 saat daha geç başlıyor (medyan aralık 24,71 ile 25,30 saat). Ani geri sıçramalar 20 saatten kısa aralıklar, yani yeniden başlatmalar (`T1`'de 15). `lf` kendi 26,5 saatlik döngüsünde günde 2,43 saat kayıyor. `sx` çizilmedi: `T1`'in hemen ardından geliyor.","caveat":"Tur başlangıçlarının saat dağılımı düzgün değil (`T1` için ki-kare p = 0,0026, 20 ile 23 UTC arasında yoğun). Yeniden başlatmaların döngüyü oraya taşıması en olası açıklama; bu bir yorum, test edilmedi. Takvim IBM'in hiçbir kaynağında tarif edilmiyor (06 §1.2, §3.1).","source":"06 §0, §3.1; results/device/schedule.json; tur başlangıçları önbellekten","x":{"label":"tarih","scale":"time"},"y":{"label":"tur başlangıcı","unit":"UTC saat","scale":"linear","min":0,"max":24},"series":[{"name":"T1","style":"dots","points":[["2026-05-13T21:57:00Z",21.95],["2026-05-14T05:24:55Z",5.415],["2026-05-15T05:57:17Z",5.955],["2026-05-15T22:25:08Z",22.419],["20 ölüm on bir ölçüm ailesi arasındaki ilişkileri inceler: `T1`, `T2`, RO (`readout_error`), P(1|0), P(0|1), `init_error`, `measure_2`, `sx`, `cz`, `rzz` ve `|zz|`. Kuplör aileleri kübite, komşu kuplörlerin ortalaması olarak taşınır. Test ailesi, başka belgelere ait bağlar çıkarıldıktan sonra kalan 23 aileler arası çifttir; `T1` ile `T2` ve RO ile P(0|1) yalnızca pozitif kontrol olarak aynı araçlardan geçirilir.","Saat, neyin paylaşılabileceğini sınırlar: bir kübitte `T1` ve `T2` saniyeler arayla, `sx` yaklaşık bir saat sonra, `cz` ve `rzz` saatler sonra damgalanır; okuma yaklaşık 4,5 saatte bir yenilenir. Bu aralıklardan kısa süren bir dalgalanma, iki aile arasında ortak olarak görülemez.","Genel tablo: kübitler arasında aileler iki ayrı kalite eksenine ayrılır; bir kübitin içinde ortak hareket saptanabilir ama çok küçüktür; bir ailenin yakın geçmişi diğerinin bir sonraki değerini öngörmez; cihaz çapındaki ortak bileşen küçüktür. Kalıcı olmayan bileşenin küçük bir kısmı aileler arasında paylaşılıyor; bu kısmın zaman ölçeği ve kökeni henüz belirlenmemiştir, geri kalanı hiçbir aileler arası testle bir kaynağa bağlanamıyor."],"bullets_tr":["**Kübitler arası seviye bağı saptanmadı.** 23 çiftin hiçbiri Benjamini-Hochberg düzeltmesinden sonra anlamlı değil (en küçük q 0,514); bütün %95 aralıkları -0,323 ile 0,291 arasında (116 ile 156 kübit). Kübitler arası yapı başka belgelere ait çiftlerde, örneğin `T1` ile `sx` -0,430.","**İki ayrı kalite ekseni.** 154 kübit ve 10 alanda bir okuma faktörü (özdeğer 3,83, varyansın %38'i) ve bir koherans-ve-kapı faktörü (2,58, %26) paralel analizi aşar. Okuma ekseni ile koherans-ve-kapı ekseni neredeyse ayrı; bu, yük örüntüsüne dayanan betimleyici bir okuma.","**Korelasyonlu sürekliliğin ötesinde arketip yok.** k = 2 ile 6 arasında Ward kümeleri, gözlenen korelasyonları taşıyan bir Gauss bulutunu hiçbir k için geçemez (p 0,154 ile 0,965) ve kararsızdır (bootstrap ARI medyanı 0,37 ile 0,42).","**Kübit içi ortak hareket saptanabilir ama çok küçük.** Ham artıklarda 23 çiftten 11 tanesi, ortak mod çıkarılınca 10 tanesi anlamlı; en büyük korelasyon 0,057 (`sx` ile P(0|1)), kontrollerde 0,693 ve 0,781. Doğrulayıcının pencere testinden sonra paylaşılan kısmın zaman ölçeği açık bir sorudur.","**Öncülük ya da gecikme saptanmadı.** Üç modelin hiçbirinde 45 (ya da 44) yönden anlamlı olan yok; en iyi zaman dışı oran 0,99854 (`init_error` → `T2`).","**Cihaz çapındaki pay küçük.** Tur ortak modu artık varyansının 0,012 (`|zz|`) ile 0,130 (`T1`) arasını taşır; okuma ve koherans için cihaz payı ay ölçeğinde büyür, yani yavaş kayan bir cihaz seviyesidir.","**Günlük cihaz değişimleri aile içinde hareket eder.** 55 aile çiftinden 8 tanesi anlamlı ve biri dışında hepsi aile içi; aileler arası tek çift P(1|0) ile `sx` (-0,341, 113 gün), bir aday.","**Aday bağ: `|zz|` ve okuma.** `|zz|` artıkları okuma hatalarıyla negatif korelasyonlu (RO ile -0,043, 166.855 eşleşme); işaret kübit-gün düzeyinde (-0,061) ve anlamlı olmadan cihaz-gün düzeyinde (-0,251) tekrar eder. `zz` yalnızca dosya zamanı taşıdığından mekanizma ve zamanlama karara bağlanamaz."],"charts":[{"id":"seviye-korelasyon-matrisi","type":"heatmap","title":"Kübit seviyeleri aile blokları içinde bağlı; test edilen 23 aileler arası çiftin hiçbiri anlamlı değil","subtitle":"Kübit başına seviyelerin (yaşam boyu `log10` olay medyanı) Spearman korelasyonu; 11 alan, çifte göre 116 ile 156 kübit. Kuplör aileleri, kübite komşu kuplörlerin ortalaması. P(0|1) = `prob_meas0_prep1`, P(1|0) = `prob_meas1_prep0`. Köşegen boş.","read":"Belirgin değerler başka belgelere ait çiftlerde: okuma bloğu 0,644 (`init_error` ile `measure_2`) ile 0,984 (RO ile P(0|1)) arasında, `T1` ile `sx` -0,430, `sx` ile `cz` (komşu) 0,416, `T1` ile `T2` 0,305. 07'nin test ettiği 23 aileler arası çift -0,145 ile 0,118 arasında; Benjamini-Hochberg sonrası en küçük q 0,514, karşılıklı bilgi de hiçbirinde anlamlı değil. Bu örneklem, bu çiftler için yaklaşık 0,3'ün ötesinde bir sıra korelasyonunu dışlar; daha zayıf bağları dışlamaz.","caveat":"Doğrulayıcı: altı çift (`measure_2` ile üç komşu kuplör alanı; RO, P(1|0) ve P(0|1) ile `|zz|` (komşu)) uzamsal öz-korelasyonu anlamlı iki alanı birleştirir; bu durumda permütasyon testinin geçerlilik önermesi tutmaz. Hiçbiri anlamlı olmadığından sıfır sonucu değişmez.","source":"07 §7.1, §5 and Verification; results/cross/levels.json (pairs), summary.json (levels)","rows":["T1","T2","RO","P(1|0)","P(0|1)","init_error","measure_2","sx","cz (komşu)","rzz (komşu)","|zz| (komşu)"],"cols":["T1","T2","RO","P(1|0)","P(0|1)","init_error","measure_2","sx","cz (komşu)","rzz (komşu)","|zz| (komşu)"],"values":[[null,0.305,0.00758,0.0795,-0.0277,-0.0667,0.158,-0.43,-0.265,-0.264,-0.00547],[0.305,null,-0.13,-0.11,-0.134,-0.145,-0.115,-0.164,-0.225,-0.237,0.0733],[0.00758,-0.13,null,0.957,0.984,0.828,0.863,-0.00971,0.165,0.176,-0.0217],[0.0795,-0.11,0.957,null,0.906,0.937,0.857,-0.105,0.0894,0.103,-0.0232],[-0.0277,-0.134,0.984,0.906,null,0.707,0.845,0.0299,0.183,0.204,-0.0315],[-0.0667,-0.145,0.828,0.937,0.707,null,0.644,-0.034,0.101,0.108,0.0283],[0.158,-0.115,0.863,0.857,0.845,0.644,null,-0.123,0.118,0.116,-0.0309],[-0.43,-0.164,-0.00971,-0.105,0.0299,-0.034,-0.123,null,0.416,0.387,-0.0155],[-0.265,-0.225,0.165,0.0894,0.183,0.101,0.118,0.416,null,0.899,0.0308],[-0.264,-0.237,0.176,0.103,0.204,0.108,0.116,0.387,0.899,null,-0.00265],[-0.00547,0.0733,-0.0217,-0.0232,-0.0315,0.0283,-0.0309,-0.0155,0.0308,-0.00265,null]],"scale":"div","domain":[-1,1],"fmt":".2f"},{"id":"iki-kalite-ekseni","type":"bar","orient":"h","title":"Okuma kalitesi ile koherans-ve-kapı kalitesi iki ayrı eksendir","subtitle":"Kübit seviyelerinin normal skorlarından PCA: ilk iki bileşenin yükleri ve %95 bootstrap aralıkları (154 kübit, 10 alan; q72 ve q99 eksik alan nedeniyle dışarıda; 500 yeniden örnekleme).","read":"PC1 (özdeğer 3,83, varyansın %38'i) okuma eksenidir: RO, P(0|1), P(1|0) ve `measure_2` yükleri 0,46 ile 0,49 arasında. PC2 (2,58, %26) koherans-ve-kapı eksenid ,"146":-0.256,"147":0.0432,"148":2.42,"149":3.97,"150":4.1,"151":0.263,"152":0.501,"153":-0.548,"154":-0.345,"155":-1.57},"node_label":"PC2 skoru"}],"toc_tr":"Bağımlılık"},{"section":"sorular","toc_tr":"Kök sorular","title_tr":"Makale için kök sorular ve bilinmeyenler","intro_tr":["Derin incelemenin vardığı yer şu: bilgi taşıyan her seri üç parçalı. Aylarca sabit kalan, varlığa özgü bir seviye; haftalar ile aylar içinde yavaş bir kayma; ve bir ölçümden ötekine hafızası olmayan büyük bir bileşen. Bu son bileşenin ne olduğu açık.","Arşiv iki basit okumayı dışlıyor. Bileşen, sabit bir seviyenin etrafındaki bağımsız tahmin hatasından ibaret değil: yavaş seviye ve deneyler arası korelasyonlar buna karşı. Readout bileşeni de binom atış (shot) gürültüsünden ibaret değil: atış gürültüsü azınlıkta. Ama arşiv bileşenin çoğunun fiziksel olduğunu da göstermiyor. Bu yüzden bileşene ne IBM tahmin gürültüsü ne de fiziksel dalgalanma deniyor."],"blocks_tr":[{"h":"Kök sorular","ordered":true,"items":["**Kalıcı olmayan bileşen nedir?** Tahmin hatası, örnekleme aralığından hızlı gerçek dinamikler ya da turlar arası yeniden kalibrasyon olabilir. Arşiv bunları ayıramıyor (00 §4.1).","**Bileşenin büyüklüğü durağan mı?** `T1`'in tur-tur robust yarı varyansı 15 ile 27 Mayıs arasındaki 13 turda 0,000404 ile 0,000686 arasındaydı, sonra tipik değeri 0,0146 oldu; 26 ile 29 Haziran arasında bir adım daha var (Pettitt p = 5,5e-12). Rejimlere yayılan bir model bu değişimi miras alır (00 §4.2).","**Bir kübitteki ayrı deneyler arasında ortak bir parça var mı, hangi zaman ölçeğinde?** Aynı turda `T1` ile `T2` 0,70; ortak kübit paylaşan kuplörler 0,22; `cz` ile `rzz` 1 saat içinde 0,205. Bağımsız hatalar bunu üretemez, iki deneye ortak bir girdi üretebilir (00 §4.3).","**Kübit kalitesinin iki ekseni ve örgünün rolü.** Readout ekseni ile koherans ve kapı ekseni ayrı; readout'un uzamsal deseni büyük ölçüde örgüdeki derece sınıflarından geliyor (00 §4.4).","**Kapı hataları dekoheransın ötesinde ne içeriyor?** Koherans limiti `sx` hatasının medyan 0,40'ı, `cz`'nin 0,333'ü; katmanlı hata izole `cz` tahmininin yaklaşık 1,4 katı (00 §4.5).","**Cihazın geçmişi ve takvimi.** Değişim noktaları bilinen olaylarla ancak şans düzeyinde örtüşüyor: en tutucu cezada 17 noktanın 5'i, beklenen 3,29 (00 §4.6).","**IBM değerleri nasıl üretiyor?** Damgalar toplu yazım zamanları gibi davranıyor; `zz` yaklaşık 5 saatte bir yeniden belirleniyor; günlük readout oturumlarının shot sayısı belirsiz (00 §4.7)."]},{"h":"Bilinmeyenler, makale için önem sırasıyla","ordered":true,"items":["Kalıcı olmayan bileşenin büyük kısmının ne olduğu. Bir tahmin bandının ölçüm hassasiyeti bandı mı yoksa fiziksel bir band mı olduğunu bu belirler.","Bileşenin büyüklüğünün durağan olup olmadığı; Mayıs 2026'da ve 26 ile 29 Haziran arasında cihaz genelinde ne değiştiği.","Ortak `T1`/`T2` bileşeninin ne olduğu. Bir turdaki readout ya da başlatma değişiminin ikisini birden oynatıp oynatmadığı henüz test edilmedi.","Deneyler arası ortak bileşenin zaman ölçeği.","Günlük readout oturumlarının shot sayısı: 2.048 mi, 4.096 mı.","Kapı hatalarının dekoherans dışındaki içeriği ve 1,4 katsayısının kaynağı.","Uzamsal desenlerin fiziksel kökeni; önbellekte kübit frekansı yok.","Üretim semantiği: `zz` nasıl üretiliyor, `lf` damgaları ne anlama geliyor.","Tekil anomaliler: 32-33 kuplörünün kalıcı arızası, Ağustos sonundaki `init_error` bölümü, 17 Mayıs'ta bilinen bir olay olmadan görülen readout düşüşü."]},{"h":"Ayırt edecek ölçümler (yalnızca öneri; donanım zamanı ekibin kararı)","ordered":false,"items":["Birkaç kübit ve kuplörde dakika aralıklı ardışık tekrarlar: `T1`, Hahn eko, tek ve iki kübitli RB, bilinen shot sayılı atama deneyleri; fit belirsizlikleri kaydedilerek, aralarda yeniden kalibrasyonlu ve kalibrasyonsuz. Tahmin gürültüsü en kısa gecikmeden itibaren düz bir variogram öngörür; hızlı dinamikler dakikalardan saatlere yükselen bir eğri öngörür.","IBM meta verisi: RB ayarları, değer başına fit belirsizliği, iş kimlikleri, günlük readout shot sayısı.","Yalnızca arşivle: 07'nin seviye penceresi testini (±2 gün ile ±7 gün) 02, 04 ve 05'teki eşleşmelere uygulamak; sonraki ref'lerde 2 saatten yakın readout oturum çiftleri biriktirmek."]}]},{"section":"dogrulama","toc_tr":"Doğrulama","title_tr":"Doğrulama durumu ve veri kuralları","intro_tr":["Her kapsam belgesini, onu yazmamış bağımsız bir ajan doğruladı. Sahibin bütün betiklerini yeniden çalıştırdı; sonuç dosyaları zaman damgası dışında alan alan aynı çıktı. En çok yük taşıyan sayıları kendi yazdığı kodla yeniden hesapladı ve yorumları çürütmeye çalıştı. Hiçbir ana sayı hatalı çıkmadı; düzeltmeler ifadelerin gücüne, testlerin geçerliliğine ve atıflara yöneldi.","Bu doğrulama aynı makinedeki ikinci bir ajandır; doğrulama masaüstündeki tekrarın yerini tutmaz."],"table_tr":{"head":["Belge","Sahip betikleri yeniden üretildi","Bağımsız yeniden hesaplanan sayı","Yorumlar"],"rows":[["02 Koherans","7 / 7","16","3 korundu, 2 kısmen korundu, 3 zayıflatıldı, 0 çürütüldü"],["03 Readout ve ölçüm","7 / 7","19","3 korundu, 1 kısmen korundu, 4 zayıflatıldı, 0 çürütüldü"],["04 Tek-kübit kapıları","6 / 6","21","4 korundu, 0 kısmen korundu, 4 zayıflatıldı, 0 çürütüldü"],["05 İki-kübit kapıları","7 / 7","23","5 korundu, 0 kısmen korundu, 3 zayıflatıldı, 1 çürütüldü"],["06 Cihaz, zaman, topoloji","7 / 7","27","5 korundu, 0 kısmen korundu, 4 zayıflatıldı, 0 çürütüldü"],["07 Aileler arası bağımlılık","7 / 7","16","3 korundu, 0 kısmen korundu, 3 zayıflatıldı, 1 çürütüldü"]]},"charts":[{"id":"dogrulama-kararlar","type":"stack","title":"Her belgede yorumların çoğu korundu ya da zayıflatıldı","subtitle":"Doğrulayıcının sınadığı yorum sayısı, karara göre; belge başına 7 ile 9 yorum","read":"Çürütülen iki yorum var: 05'teki \"gün içi ikinci kalibrasyon\" p-değerleri (sözde tekrar) ve 07'deki bir permütasyon geçerlilik öncülü; 07'nin boş sonucu yine de geçerli.","source":"00-overview.md, verification-status table","x":{"label":"belge","scale":"band"},"y":{"label":"yorum sayısı","scale":"linear"},"categories":["02","03","04","05","06","07"],"series":[{"name":"Korundu","values":[3,3,4,5,5,3]},{"name":"Kısmen korundu","values":[2,1,0,0,0,0]},{"name":"Zayıflatıldı","values":[3,4,4,3,4,3]},{"name":"Çürütüldü","values":[0,0,0,1,0,1]}]},{"id":"dogrulama-sayilar","type":"bar","title":"Doğrulayıcılar 122 sayıyı kendi koduyla yeniden hesapladı","subtitle":"Belge başına, doğrulayıcının tablosundaki satır sayısı","read":"Uyuşmayan tek satır 06'daki bir rastgele çekim minimumu (7,8 yerine 7,62); tohuma bağlı. Yaklaşık uyuşmalar kayıt seçimi ya da medyan tanımı farkından geliyor.","source":"00-overview.md, verification-status table","x":{"label":"belge","scale":"band"},"y":{"label":"yeniden hesaplanan sayı","scale":"linear"},"categories":["02","03","04","05","06","07"],"series":[{"name":"Bağımsız yeniden hesaplanan sayı","values":[16,19,21,23,27,16]}]}],"blocks_tr":[{"h":"Bu arşivi kullanan her analizin uyması gereken kurallar","ordered":true,"items":["`gate_error >= 1` IBM'in \"kalibre edilmedi\" yer tutucusudur; olaylar oluşturulmadan önce maskelenmeli.","Olay kuralı alanın tarih anlamına göre seçilmeli: ölçülmüş alanlarda değer ve damga birlikte yeni olmalı; belge oluşturulurken damgalanan alanlarda (eşikler, `zz`, `jq`, `rz`) ve uzunluklarda yalnızca değer değişimi sayılır.","`x`, `id`, `rx`, `xslow` hataları `sx`'in kopyasıdır; `measure` hatası `readout_error`'dır; bir kuplörün iki yönü aynı değeri taşır. Kopyalar ayrı bilgi gibi sayılmamalı.","Arşiv kapsamı dönemden döneme değişti: Ağustos başına kadar yalnızca saatlik yoklama vardı, sonra geçmiş belgeler eklendi. Aylar arası olay hızı ve kadans karşılaştırmaları bunu hesaba katmalı.","Şema başlangıçları eksik veri değildir: `measure.threshold` 8 Haziran, `init_error` 4 Ağustos, `measure_2` 7 Ağustos, `measure_reset` ve `reset_2` 2 Eylül.","Kalıcı arızalı varlıklar dışlanmalı ve listelenmeli: `sx` için `q72`; `cz` için 27-28, 32-33, 71-72, 72-73; `rzz` için 32-33, 71-72, 72-73, 95-99, 99-115.","`last_update_date` bir ölçüm zamanı değildir. Ayrık durum özeti yalnızca kübit kayıtlarını kapsar, kapı değişimlerini görmez.","Kalıcı olmayan bileşene kanıt olmadan ölçüm ya da tahmin gürültüsü denmemeli."]}]}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  d3.formatDefaultLocale({ decimal: ",", thousands: ".", grouping: [3], currency: ["", " ₺"] });
  d3.timeFormatDefaultLocale({
    dateTime: "%A, %e %B %Y %X", date: "%d.%m.%Y", time: "%H:%M:%S", periods: ["", ""],
    days: ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"],
    shortDays: ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"],
    months: ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"],
    shortMonths: ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"],
  });
  const fmtG = d3.format(".3~g");
  const fmtDate = d3.timeFormat("%d %b %Y");
  const fmtDateTime = d3.timeFormat("%d %b %Y %H:%M");

  // ---------- small helpers
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function md(s) {
    return esc(s == null ? "" : s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function tok(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function cat(i) { return tok(["--s1", "--s2", "--s3", "--s4"][i % 4]); }
  function num(v) {
    if (v == null || Number.isNaN(v)) return "yok";
    if (typeof v !== "number") return String(v);
    const a = Math.abs(v);
    if (a !== 0 && (a < 1e-4)) return d3.format(".2~e")(v).replace(".", ",");
    if (a >= 1000) return d3.format(",.0f")(v);
    return fmtG(v);
  }
  function isTime(axis) { return axis && axis.scale === "time"; }
  function toX(v, axis) { return isTime(axis) ? new Date(v) : v; }
  function fmtX(v, axis) { return isTime(axis) ? fmtDateTime(v instanceof Date ? v : new Date(v)) : num(v); }

  function plain(s) { return String(s == null ? "" : s).replace(/`/g, "").replace(/\*\*/g, ""); }
  const SYMS = [d3.symbolCircle, d3.symbolSquare, d3.symbolTriangle, d3.symbolDiamond];
  const tip = document.getElementById("tip");
  function showTip(evt, head, rows) {
    tip.replaceChildren();
    if (head) { const h = el("div", "th"); h.textContent = plain(head); tip.appendChild(h); }
    rows.forEach(r => {
      const row = el("div", "tr");
      if (r.color) { const k = el("span", "tk"); k.style.borderTopColor = r.color; row.appendChild(k); }
      const v = el("span", "tv"); v.textContent = plain(r.value); row.appendChild(v);
      if (r.label) { const l = el("span"); l.textContent = " " + plain(r.label); l.style.color = "var(--ink-2)"; row.appendChild(l); }
      tip.appendChild(row);
    });
    tip.hidden = false;
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    let x = evt.clientX + pad, y = evt.clientY + pad;
    if (x + w > window.innerWidth - 8) x = evt.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = evt.clientY - h - pad;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  }
  function hideTip() { tip.hidden = true; }

  // Log ticks: denser mantissas when the domain spans few decades, so an axis never shows a single label.
  const MANT = [[1.3, [1, 2, 3, 5, 7]], [2.6, [1, 2, 5]], [4.2, [1, 3]], [Infinity, [1]]];
  function logTicks(scale) {
    const d = scale.domain(), a = Math.min(d[0], d[1]), b = Math.max(d[0], d[1]);
    const mant = MANT.find(m => Math.log10(b / a) <= m[0])[1], t = [];
    for (let k = Math.floor(Math.log10(a)); k <= Math.ceil(Math.log10(b)); k++) mant.forEach(mm => { const v = mm * Math.pow(10, k); if (v >= a * 0.999 && v <= b * 1.001) t.push(v); });
    return t.length >= 2 ? t : scale.ticks(4);
  }
  // Log axes are padded by 5% of their span instead of being rounded out to whole decades.
  function makeScale(axis, values, range, opts) {
    opts = opts || {};
    const sc = axis && axis.scale;
    let ext = d3.extent(values.filter(v => v != null && (sc !== "log" || v > 0)));
    if (ext[0] == null) ext = sc === "log" ? [1, 10] : [0, 1];
    const fixedLo = axis && axis.min != null, fixedHi = axis && axis.max != null;
    if (sc === "log") {
      if (ext[0] === ext[1]) ext = [ext[0] / 2, ext[1] * 2];
      const pad = Math.pow(ext[1] / ext[0], 0.05);
      ext = [ext[0] / pad, ext[1] * pad];
    }
    if (fixedLo) ext[0] = isTime(axis) ? new Date(axis.min) : axis.min;
    if (fixedHi) ext[1] = isTime(axis) ? new Date(axis.max) : axis.max;
    let s;
    if (sc === "time") s = d3.scaleUtc().domain(ext).range(range);
    else if (sc === "log") s = d3.scaleLog().domain(ext).range(range);
    else {
      if (ext[0] === ext[1]) ext = [ext[0] - 1, ext[1] + 1];
      if (opts.zero && ext[0] > 0 && !fixedLo) ext[0] = 0;
      if (opts.headroom && !fixedHi && ext[1] > 0) ext[1] = ext[1] * (1 + opts.headroom);
      s = d3.scaleLinear().domain(ext).range(range);
      if (!fixedLo && !fixedHi) s.nice();
    }
    return s;
  }
  function axisFor(scale, axis, orient, n) {
    const ax = orient === "bottom" ? d3.axisBottom(scale) : d3.axisLeft(scale);
    if (axis && axis.scale === "log") { ax.tickValues(logTicks(scale)).tickFormat(v => num(v)); }
    else if (axis && axis.scale === "time") { ax.ticks(n || 5).tickFormat(d3.timeFormat("%d %b")); }
    else if (axis && axis.scale === "band") { ax.tickFormat(v => plain(v)); }
    else { ax.ticks(n || 5).tickFormat(v => num(v)); }
    return ax.tickSizeOuter(0);
  }
  function axisLabel(axis) { if (!axis) return ""; return plain((axis.label || "") + (axis.unit ? " (" + axis.unit + ")" : "")); }

  // Top margin: the y-axis title row, plus one row per staggered x-marker label (at most three).
  function markerRows(spec) { return Math.min(3, (spec.markers || []).filter(k => k.axis === "x").length); }
  function topMargin(spec, base) { return base + markerRows(spec) * 12; }
  function frame(host, width, height, m) {
    const svg = d3.select(host).append("svg").attr("viewBox", `0 0 ${width} ${height}`).attr("role", "img");
    const g = svg.append("g").attr("transform", `translate(${m.l},${m.t})`);
    return { svg, g, w: width - m.l - m.r, h: height - m.t - m.b, m };
  }
  function drawAxes(f, xs, ys, spec, opts) {
    opts = opts || {};
    const xa = axisFor(xs, spec.x, "bottom", f.w < 380 ? 3 : 5), ya = axisFor(ys, spec.y, "left", 5);
    if (!opts.noGrid && spec.y && spec.y.scale !== "band") {
      f.g.append("g").attr("class", "gl").call(d3.axisLeft(ys).tickValues(spec.y.scale === "log" ? logTicks(ys) : ys.ticks(5)).tickSize(-f.w).tickFormat("")).call(g => g.select(".domain").remove());
    }
    const gx = f.g.append("g").attr("transform", `translate(0,${f.h})`).call(xa);
    if (opts.rotateX) gx.selectAll("text").attr("transform", "rotate(-35)").style("text-anchor", "end").attr("dx", "-0.4em").attr("dy", "0.5em");
    f.g.append("g").call(ya);
    if (spec.x && spec.x.label) f.g.append("text").attr("class", "alab").attr("x", f.w).attr("y", f.h + (opts.xLabelDy || 34)).attr("text-anchor", "end").text(axisLabel(spec.x));
    if (spec.y && spec.y.label) f.g.append("text").attr("class", "alab").attr("x", 0).attr("y", -f.m.t + 12).attr("text-anchor", "start").text(axisLabel(spec.y));
  }
  // x-marker labels sit above the plot, greedily staggered so they never overlap; y-marker labels sit at the left end.
  function drawMarkers(f, xs, ys, spec) {
    const mk = spec.markers || [];
    const g = f.g.append("g").attr("class", "mk");
    const placed = [[], [], []];
    const xm = mk.filter(m => m.axis === "x").map(m => xs(toX(m.value, spec.x)));
    mk.forEach(m => {
      const label = plain(m.label || "");
      if (m.axis === "x") {
        const x = xs(toX(m.value, spec.x));
        if (!(x >= 0 && x <= f.w)) return;
        g.append("line").attr("x1", x).attr("x2", x).attr("y1", 0).attr("y2", f.h);
        const wpx = label.length * 5.8 + 6;
        const others = xm.filter(o => Math.abs(o - x) > 0.5);
        const freeR = !others.some(o => o > x && o < x + wpx + 4) && x + wpx <= f.w + 12;
        const freeL = !others.some(o => o < x && o > x - wpx - 4) && x - wpx >= -f.m.l + 4;
        const anchor = freeR && (!freeL || x <= f.w * 0.6) ? "start" : freeL ? "end" : (x > f.w * 0.6 ? "end" : "start");
        const x0 = anchor === "start" ? x : x - wpx, x1 = anchor === "start" ? x + wpx : x;
        let lvl = placed.findIndex(row => row.every(([a, b]) => x1 < a - 4 || x0 > b + 4));
        if (lvl < 0) lvl = placed.length - 1;
        placed[lvl].push([x0, x1]);
        const ty = -6 - lvl * 12;
        g.append("line").attr("x1", x).attr("x2", x).attr("y1", ty + 3).attr("y2", 0);
        g.append("text").attr("x", x + (anchor === "start" ? 3 : -3)).attr("y", ty).attr("text-anchor", anchor).text(label);
      } else {
        const y = ys(m.value);
        if (!(y >= 0 && y <= f.h)) return;
        g.append("line").attr("x1", 0).attr("x2", f.w).attr("y1", y).attr("y2", y);
        g.append("text").attr("x", 4).attr("y", y - 4).attr("text-anchor", "start").text(label);
      }
    });
  }
  function legendFor(card, items) {
    const ul = card.querySelector(".legend"); ul.replaceChildren();
    if (!items || items.length < 2) { ul.hidden = true; return; }
    ul.hidden = false;
    items.forEach(it => {
      const li = el("li");
      let k;
      if (it.kind === "sym") {
        k = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        k.setAttribute("width", "12"); k.setAttribute("height", "12"); k.setAttribute("viewBox", "-6 -6 12 12");
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d3.symbol().type(SYMS[(it.sym || 0) % 4]).size(40)()); p.setAttribute("fill", it.color); k.appendChild(p);
      } else {
        k = el("span", "k-" + (it.kind || "line"));
        if (it.kind === "box" || it.kind === "dot") k.style.background = it.color;
        else if (it.kind === "ring") { k.style.borderColor = it.color; if (it.dash) k.style.borderStyle = "dashed"; }
        else { k.style.borderTopColor = it.color; if (it.dash) k.style.borderTopStyle = "dashed"; }
      }
      li.appendChild(k); const t = el("span"); t.textContent = plain(it.name); li.appendChild(t); ul.appendChild(li);
    });
  }
  function rampFor(card, colorAt, labels) {
    const r = card.querySelector(".ramp"); r.replaceChildren(); r.hidden = false;
    const lo = el("span"); lo.textContent = plain(labels[0]);
    const bar = el("span", "bar");
    const stops = d3.range(0, 1.0001, 0.1).map(t => colorAt(t) + " " + Math.round(t * 100) + "%");
    bar.style.background = "linear-gradient(90deg," + stops.join(",") + ")";
    const hi = el("span"); hi.textContent = plain(labels[1]);
    r.append(lo, bar, hi);
    if (labels[2]) { const n = el("span"); n.textContent = plain(labels[2]); r.appendChild(n); }
  }

  // ---------- chart types
  const R = {};

  R.line = function (host, card, spec, W) {
    const H = Math.max(240, Math.min(340, W * 0.52)), m = { t: topMargin(spec, 26), r: 16, b: 44, l: 56 };
    const f = frame(host, W, H, m);
    const pts = spec.series.flatMap(s => s.points.map(p => [toX(p[0], spec.x), p[1]]));
    const bands = spec.series.flatMap(s => (s.band || []).flatMap(b => [b[1], b[2]]));
    const xs = makeScale(spec.x, pts.map(p => p[0]), [0, f.w]);
    const ys = makeScale(spec.y, pts.map(p => p[1]).concat(bands), [f.h, 0]);
    drawAxes(f, xs, ys, spec);
    const ok = v => v != null && (spec.y.scale !== "log" || v > 0);
    const multiDots = spec.series.filter(s => (s.style || "line") === "dots").length > 1;
    spec.series.forEach((s, i) => {
      const c = cat(i), raw = s.points.map(p => [toX(p[0], spec.x), p[1]]);
      // Break a time series at gaps far longer than its usual spacing, so a line never implies data across a pause.
      const gapAt = new Set();
      if (isTime(spec.x) && raw.length > 3) {
        const xv = raw.map(p => +p[0]), dif = xv.slice(1).map((v, k) => v - xv[k]);
        const thr = Math.max(3 * 864e5, (d3.median(dif) || 0) * 8);
        dif.forEach((d, k) => { if (d > thr) gapAt.add(k + 1); });
      }
      const data = raw.map(p => [xs(p[0]), ok(p[1]) ? ys(p[1]) : null]);
      const path = [];
      data.forEach((d, k) => { if (gapAt.has(k)) path.push([d[0], null]); path.push(d); });
      if (s.band && s.band.length) {
        const area = d3.area().defined(b => ok(b[1]) && ok(b[2])).x(b => xs(toX(b[0], spec.x))).y0(b => ys(b[1])).y1(b => ys(b[2]));
        f.g.append("path").attr("d", area(s.band)).attr("fill", c).attr("fill-opacity", 0.12);
      }
      const style = s.style || "line";
      if (style.includes("line")) f.g.append("path").attr("d", d3.line().defined(d => d[1] != null).x(d => d[0]).y(d => d[1])(path)).attr("fill", "none").attr("stroke", c).attr("stroke-width", 2).attr("stroke-linejoin", "round").attr("stroke-linecap", "round");
