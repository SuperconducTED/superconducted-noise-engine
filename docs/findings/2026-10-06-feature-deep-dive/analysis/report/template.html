  function isTime(axis) { return axis && axis.scale === "time"; }

  function plain(s) { return String(s == null ? "" : s).replace(/`/g, "").replace(/\*\*/g, ""); }
  const SYMS = [d3.symbolCircle, d3.symbolSquare, d3.symbolTriangle, d3.symbolDiamond];
  const tip = document.getElementById("tip");
  function showTip(evt, head, rows) {
    tip.replaceChildren();
    if (head) { const h = el("div", "th"); h.textContent = plain(head); tip.appendChild(h); }
    rows.forEach(r => {
      const row = el("div", "tr");

      const v = el("span", "tv"); v.textContent = plain(r.value); row.appendChild(v);

      tip.appendChild(row);
    });
    tip.hidden = false;
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    let x = evt.clientX + pad, y = evt.clientY + pad;
    if (x + w > window.innerWidth - 8) x = evt.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = evt.clientY - h - pad;

  function hideTip() { tip.hidden = true; }

  // Log ticks: denser mantissas when the domain spans few decades, so an axis never shows a single label.
  const MANT = [[1.3, [1, 2, 3, 5, 7]], [2.6, [1, 2, 5]], [4.2, [1, 3]], [Infinity, [1]]];
  function logTicks(scale) {
    const d = scale.domain(), a = Math.min(d[0], d[1]), b = Math.max(d[0], d[1]);
    const mant = MANT.find(m => Math.log10(b / a) <= m[0])[1], t = [];
    for (let k = Math.floor(Math.log10(a)); k <= Math.ceil(Math.log10(b)); k++) mant.forEach(mm => { const v = mm * Math.pow(10, k); if (v >= a * 0.999 && v <= b * 1.001) t.push(v); });
    return t.length >= 2 ? t : scale.ticks(4);
  }
  // Log axes are padded by 5% of their span instead of being rounded out to whole decades.
  function makeScale(axis, values, range, opts) {
    opts = opts || {};
    const sc = axis && axis.scale;
    let ext = d3.extent(values.filter(v => v != null && (sc !== "log" || v > 0)));
    if (ext[0] == null) ext = sc === "log" ? [1, 10] : [0, 1];
    const fixedLo = axis && axis.min != null, fixedHi = axis && axis.max != null;
    if (sc === "log") {
      if (ext[0] === ext[1]) ext = [ext[0] / 2, ext[1] * 2];
      const pad = Math.pow(ext[1] / ext[0], 0.05);
      ext = [ext[0] / pad, ext[1] * pad];
    }
    if (fixedLo) ext[0] = isTime(axis) ? new Date(axis.min) : axis.min;
    if (fixedHi) ext[1] = isTime(axis) ? new Date(axis.max) : axis.max;
    let s;
    if (sc === "time") s = d3.scaleUtc().domain(ext).range(range);
    else if (sc === "log") s = d3.scaleLog().domain(ext).range(range);
    else {
      if (ext[0] === ext[1]) ext = [ext[0] - 1, ext[1] + 1];
      if (opts.zero && ext[0] > 0 && !fixedLo) ext[0] = 0;
      if (opts.headroom && !fixedHi && ext[1] > 0) ext[1] = ext[1] * (1 + opts.headroom);
      s = d3.scaleLinear().domain(ext).range(range);
      if (!fixedLo && !fixedHi) s.nice();
    }
    return s;
  }
  function axisFor(scale, axis, orient, n) {
    const ax = orient === "bottom" ? d3.axisBottom(scale) : d3.axisLeft(scale);
    if (axis && axis.scale === "log") { ax.tickValues(logTicks(scale)).tickFormat(v => num(v)); }
    else if (axis && axis.scale === "time") { ax.ticks(n || 5).tickFormat(d3.timeFormat("%d %b")); }
    else if (axis && axis.scale === "band") { ax.tickFormat(v => plain(v)); }
    else { ax.ticks(n || 5).tickFormat(v => num(v)); }
    return ax.tickSizeOuter(0);
  }
  function axisLabel(axis) { if (!axis) return ""; return plain((axis.label || "") + (axis.unit ? " (" + axis.unit + ")" : "")); }

  // Top margin: the y-axis title row, plus one row per staggered x-marker label (at most three).
  function markerRows(spec) { return Math.min(3, (spec.markers || []).filter(k => k.axis === "x").length); }

  function frame(host, width, height, m) {

    }

    mk.forEach(m => {
      const label = plain(m.label || "");
      if (m.axis === "x") {
        const x = xs(toX(m.value, spec.x));
        if (!(x >= 0 && x <= f.w)) return;
        g.append("line").attr("x1", x).attr("x2", x).attr("y1", 0).attr("y2", f.h);

    spec.values.forEach((row, i) => row.forEach((v, j) => {
      const bg = v == null ? tok("--wash") : colorOf(v);
      f.g.append("rect").attr("x", j * cell + 1).attr("y", i * cell + 1).attr("width", cell - 2).attr("height", cell - 2).attr("rx", 3).attr("fill", bg)
        .on("pointermove", evt => showTip(evt, rows[i] + " · " + cols[j], [{ value: v == null ? "yok" : fmt(v), label: "" }])).on("pointerleave", hideTip);
      if (v != null && cell >= 30 && cols.length <= 14) f.g.append("text").attr("x", j * cell + cell / 2).attr("y", i * cell + cell / 2 + 3.5).attr("text-anchor", "middle").attr("font-size", 10).style("fill", textOn(bg)).style("pointer-events", "none").text(fmt(v));
    }));
  };

  R.forest = function (host, card, spec, W) {
    const rows = spec.rows;
    const lw = Math.min(230, 12 + (d3.max(rows, r => String(r.label).length) || 4) * 6.4), rowH = 24;
    const H = 30 + rows.length * rowH + 36, m = { t: 12, r: 20, b: 42, l: lw };
    const f = frame(host, W, H, m);
    const vals = rows.flatMap(r => [r.est, r.lo, r.hi]).filter(v => v != null).concat(spec.ref != null ? [spec.ref] : []);
    const xAx = Object.assign({ scale: "linear" }, spec.x);
    const xs = makeScale(xAx, vals, [0, f.w]);
    const yb = d3.scaleBand().domain(rows.map((r, i) => i)).range([0, f.h]).padding(0.3);
    f.g.append("g").attr("class", "gl").call(d3.axisBottom(xs).tickValues(xAx.scale === "log" ? logTicks(xs) : xs.ticks(5)).tickSize(f.h).tickFormat("")).call(g => g.select(".domain").remove());
    f.g.append("g").attr("transform", `translate(0,${f.h})`).call(axisFor(xs, xAx, "bottom", f.w < 320 ? 3 : 5));
    f.g.append("g").call(d3.axisLeft(yb).tickFormat(i => plain(rows[i].label)).tickSizeOuter(0));
    if (xAx.label) f.g.append("text").attr("class", "alab").attr("x", f.w).attr("y", f.h + 34).attr("text-anchor", "end").text(axisLabel(xAx));
    if (spec.ref != null) f.g.append("line").attr("x1", xs(spec.ref)).attr("x2", xs(spec.ref)).attr("y1", 0).attr("y2", f.h).attr("stroke", tok("--ink-2")).attr("stroke-opacity", 0.6);
    const groups = [...new Set(rows.map(r => r.group || ""))];
    rows.forEach((r, i) => {
      const y = yb(i) + yb.bandwidth() / 2, c = cat(groups.indexOf(r.group || ""));
      if (r.lo != null && r.hi != null) f.g.append("line").attr("x1", xs(r.lo)).attr("x2", xs(r.hi)).attr("y1", y).attr("y2", y).attr("stroke", c).attr("stroke-width", 2).attr("stroke-linecap", "round");
      f.g.append("circle").attr("cx", xs(r.est)).attr("cy", y).attr("r", 4.5).attr("fill", c).attr("stroke", tok("--surface")).attr("stroke-width", 2);
      f.g.append("rect").attr("x", 0).attr("y", yb(i)).attr("width", f.w).attr("height", yb.bandwidth()).attr("fill", "transparent")
        .on("pointermove", evt => showTip(evt, r.label + (r.group ? " · " + r.group : ""), [{ color: c, value: num(r.est), label: (r.lo != null ? "[" + num(r.lo) + ", " + num(r.hi) + "]" : "") }])).on("pointerleave", hideTip);
    });
    legendFor(card, groups.filter(g => g).length > 1 ? groups.map((g, i) => ({ name: g, color: cat(i), kind: "dot" })) : []);
  };

  R.gantt = function (host, card, spec, W) {
    const rows = spec.rows;
    const lw = Math.min(210, 12 + (d3.max(rows, r => String(r.label).length) || 4) * 6.4), rowH = 22;
    const H = topMargin(spec, 14) + rows.length * rowH + 40, m = { t: topMargin(spec, 14), r: 18, b: 40, l: lw };
    const f = frame(host, W, H, m);
    const times = rows.flatMap(r => r.spans.flat()).map(t => new Date(t));
    const xs = makeScale({ scale: "time", min: spec.x && spec.x.min, max: spec.x && spec.x.max }, times, [0, f.w]);
    const yb = d3.scaleBand().domain(rows.map((r, i) => i)).range([0, f.h]).padding(0.28);
    f.g.append("g").attr("class", "gl").call(d3.axisBottom(xs).ticks(6).tickSize(f.h).tickFormat("")).call(g => g.select(".domain").remove());
    f.g.append("g").attr("transform", `translate(0,${f.h})`).call(d3.axisBottom(xs).ticks(W < 500 ? 4 : 7).tickFormat(d3.timeFormat("%d %b")).tickSizeOuter(0));
    f.g.append("g").call(d3.axisLeft(yb).tickFormat(i => plain(rows[i].label)).tickSizeOuter(0));
    const groups = [...new Set(rows.map(r => r.group || ""))];
    rows.forEach((r, i) => {
      const c = cat(groups.indexOf(r.group || ""));
      r.spans.forEach(([a, b]) => {
        const x0 = xs(new Date(a)), x1 = xs(new Date(b));
        f.g.append("rect").attr("x", x0).attr("y", yb(i)).attr("width", Math.max(2, x1 - x0)).attr("height", yb.bandwidth()).attr("rx", 3).attr("fill", c)
          .on("pointermove", evt => showTip(evt, r.label, [{ color: c, value: fmtDate(new Date(a)) + " ile " + fmtDate(new Date(b)), label: "" }])).on("pointerleave", hideTip);
      });
    });
    drawMarkers(f, xs, null, { markers: (spec.markers || []).filter(k => k.axis === "x"), x: { scale: "time" } });
    legendFor(card, groups.filter(g => g).length > 1 ? groups.map((g, i) => ({ name: g, color: cat(i), kind: "box" })) : []);
  };

  // Flag styles: each flag key gets its own colour and dash, the same on the map and in the legend.
  function flagStyles(spec) {
    const STY = [["--crit", null], ["--warn", null], ["--crit", "5 3"], ["--ink-2", "3 3"], ["--warn", "5 3"]];
    const out = {};
    Object.keys(spec.flags || {}).forEach((k, i) => { const st = STY[i % STY.length]; out[k] = { color: tok(st[0]), dash: st[1] }; });
    return out;
  }
  R.map = function (host, card, spec, W) {
    const L = DATA.layout, coords = L.coords;
    const cols = d3.max(coords, c => c[0]), rws = d3.max(coords, c => c[1]);
    const cw = Math.min(56, (W - 24) / (cols + 0.6));
    const H = cw * (rws + 0.8), m = { t: cw * 0.5, r: cw * 0.3, b: cw * 0.4, l: cw * 0.3 + (W - 24 - cw * (cols + 0.6)) / 2 };
    const f = frame(host, W, H, m);
    const X = q => (coords[q][0] - 1) * cw + cw * 0.3, Y = q => (coords[q][1] - 1) * cw + cw * 0.2;
    const nv = spec.node_values || {}, ev = spec.edge_values || {};
    const nVals = Object.values(nv).filter(v => v != null), eVals = Object.values(ev).filter(v => v != null);
    const allVals = nVals.length ? nVals : eVals;
    let colorOf;
    if (spec.scale === "div") {
      const mx = spec.domain ? Math.max(Math.abs(spec.domain[0]), Math.abs(spec.domain[1])) : (d3.quantile(allVals.map(Math.abs).sort(d3.ascending), 0.98) || 1);
      colorOf = v => divColor(v / mx);
      rampFor(card, t => divColor(t * 2 - 1), [num(-mx), num(mx), "orta = 0"]);
    } else {
      // Rank colouring: a value's colour is its percentile among the map's values, so outliers cannot flatten the rest.
      const sorted = allVals.slice().sort(d3.ascending), n = sorted.length;
      const rank = v => n > 1 ? (d3.bisectLeft(sorted, v) + d3.bisectRight(sorted, v) - 1) / 2 / (n - 1) : 0.5;
      colorOf = v => seqColor(0.08 + 0.92 * rank(v));
      rampFor(card, t => seqColor(0.08 + 0.92 * t), [num(sorted[0]), num(sorted[n - 1]), "renk sıraya göre; ortanca " + num(d3.quantile(sorted, 0.5))]);
    }
    const eFlags = spec.edge_flags || {}, nFlags = spec.node_flags || {}, FS = flagStyles(spec);
    const hasEdges = eVals.length > 0, labels = [];
    L.couplers.forEach(([a, b]) => {
      const key = Math.min(a, b) + "-" + Math.max(a, b), v = ev[key], fk = eFlags[key];
      const col = hasEdges ? (v == null ? tok("--wash") : colorOf(v)) : tok("--axis");
      const line = f.g.append("line").attr("x1", X(a)).attr("y1", Y(a)).attr("x2", X(b)).attr("y2", Y(b)).attr("stroke", col).attr("stroke-width", hasEdges ? cw * 0.26 : 1.5).attr("stroke-linecap", hasEdges ? "round" : "butt");
      if (fk) {
        const st = FS[fk] || { color: tok("--crit"), dash: null };
        line.attr("stroke", st.color).attr("stroke-width", hasEdges ? cw * 0.26 : 3.4).attr("stroke-linecap", "butt");
        if (st.dash) line.attr("stroke-dasharray", st.dash);
        labels.push({ x: (X(a) + X(b)) / 2, y: (Y(a) + Y(b)) / 2 - cw * 0.22, t: a + "-" + b });
      }
      line.on("pointermove", evt => showTip(evt, "kuplör " + a + "-" + b, [{ value: v == null ? "yok" : num(v), label: spec.edge_label || "" }].concat(fk ? [{ value: (spec.flags || {})[fk] || fk, label: "" }] : []))).on("pointerleave", hideTip);
    });
    coords.forEach((_, q) => {
      const v = nv[String(q)], fk = nFlags[String(q)];
      const fill = nVals.length ? (v == null ? tok("--surface") : colorOf(v)) : tok("--surface");
      const r = cw * (hasEdges ? 0.2 : 0.3);
      const c = f.g.append("circle").attr("cx", X(q)).attr("cy", Y(q)).attr("r", r).attr("fill", fill).attr("stroke", tok("--axis")).attr("stroke-width", 1);
      if (fk) {
        const st = FS[fk] || { color: tok("--crit"), dash: null };
        c.attr("stroke", st.color).attr("stroke-width", 3);
        if (st.dash) c.attr("stroke-dasharray", st.dash);
        labels.push({ x: X(q), y: Y(q) - r - 4, t: "q" + q });
      }
      if (cw >= 30 && !hasEdges) f.g.append("text").attr("x", X(q)).attr("y", Y(q) + 3).attr("text-anchor", "middle").attr("font-size", Math.min(10, cw * 0.24)).style("fill", textOn(fill)).style("pointer-events", "none").text(q);
      c.on("pointermove", evt => showTip(evt, "q" + q + " · derece " + L.degree[q], [{ value: v == null ? "yok" : num(v), label: spec.node_label || "" }].concat(fk ? [{ value: (spec.flags || {})[fk] || fk, label: "" }] : []))).on("pointerleave", hideTip);
    });
    const lg = f.g.append("g").attr("class", "mk"), boxes = [];
    labels.forEach(l => {
      const w = l.t.length * 6.4 + 4, h = 11, d = cw * 0.42;
      const cands = [[l.x, l.y], [l.x, l.y + 2 * d], [l.x - w / 2 - d * 0.6, l.y + d], [l.x + w / 2 + d * 0.6, l.y + d], [l.x, l.y - d * 0.8]];
      let pos = cands.find(([x, y]) => x - w / 2 >= -m.l + 2 && x + w / 2 <= f.w + m.r - 2 && boxes.every(b => x + w / 2 < b[0] || x - w / 2 > b[2] || y < b[1] || y - h > b[3]));
      if (!pos) pos = cands[0];
      boxes.push([pos[0] - w / 2, pos[1] - h, pos[0] + w / 2, pos[1]]);
      lg.append("text").attr("x", pos[0]).attr("y", pos[1]).attr("text-anchor", "middle").attr("font-weight", 600).text(l.t);
    });
    const fl = spec.flags || {};
    const nodeKeys = new Set(Object.values(nFlags)), legendItems = [];
    if (Object.keys(fl).length) {
      legendItems.push({ name: "renk: " + (nVals.length ? (spec.node_label || "değer") : (spec.edge_label || "değer")), color: seqColor(0.7), kind: "dot" });
      Object.keys(fl).forEach(k => legendItems.push({ name: fl[k], color: FS[k].color, dash: FS[k].dash, kind: nodeKeys.has(k) ? "ring" : "line" }));
    }
    legendFor(card, legendItems);
  };

  // ---------- table view
  function tableRows(spec) {
    const t = spec.type;
    if (t === "line" || t === "scatter") return { head: ["seri", axisLabel(spec.x) || "x", axisLabel(spec.y) || "y"], rows: spec.series.flatMap(s => s.points.map(p => [s.name, isTime(spec.x) ? fmtDateTime(new Date(p[0])) : num(p[0]), num(p[1]) + (p[2] != null ? " (" + p[2] + ")" : "")])) };
    if (t === "bar" || t === "stack") return { head: ["kategori"].concat(spec.series.map(s => s.name)), rows: spec.categories.map((c, j) => [c].concat(spec.series.map(s => num(s.values[j]) + (s.lo && s.lo[j] != null ? " [" + num(s.lo[j]) + ", " + num(s.hi[j]) + "]" : "")))) };
    if (t === "hist") return { head: ["seri", "alt sınır", "üst sınır", "sayı"], rows: spec.series.flatMap(s => s.counts.map((c, j) => [s.name, num(s.edges[j]), num(s.edges[j + 1]), num(c)])) };
    if (t === "heatmap") return { head: [""].concat(spec.cols), rows: spec.rows.map((r, i) => [r].concat(spec.values[i].map(v => num(v)))) };
    if (t === "forest") return { head: ["satır", "grup", "tahmin", "alt", "üst"], rows: spec.rows.map(r => [r.label, r.group || "", num(r.est), num(r.lo), num(r.hi)]) };
    if (t === "gantt") return { head: ["satır", "başlangıç", "bitiş"], rows: spec.rows.flatMap(r => r.spans.map(([a, b]) => [r.label, fmtDateTime(new Date(a)), fmtDateTime(new Date(b))])) };
    if (t === "map") {
      const out = [];
      Object.entries(spec.node_values || {}).forEach(([q, v]) => out.push(["q" + q, num(v), (spec.flags || {})[(spec.node_flags || {})[q]] || ""]));
      Object.entries(spec.edge_values || {}).forEach(([k, v]) => out.push([k, num(v), (spec.flags || {})[(spec.edge_flags || {})[k]] || ""]));
      Object.entries(spec.node_flags || {}).forEach(([q, fg]) => { if (!(spec.node_values || {})[q] && !(q in (spec.node_values || {}))) out.push(["q" + q, "", (spec.flags || {})[fg] || fg]); });
      Object.entries(spec.edge_flags || {}).forEach(([k, fg]) => { if (!(k in (spec.edge_values || {}))) out.push([k, "", (spec.flags || {})[fg] || fg]); });
      return { head: ["varlık", "değer", "işaret"], rows: out };
    }
    return { head: [], rows: [] };
  }
  function fillTable(details, spec) {
    if (details.dataset.done) return;
    const { head, rows } = tableRows(spec);
    const tw = details.querySelector(".tw"), table = document.createElement("table");
    const thead = document.createElement("thead"), tr = document.createElement("tr");
    head.forEach(h => { const th = document.createElement("th"); th.textContent = plain(h); tr.appendChild(th); });
    thead.appendChild(tr); table.appendChild(thead);
    const tb = document.createElement("tbody");
    rows.slice(0, 2500).forEach(r => { const row = document.createElement("tr"); r.forEach(c => { const td = document.createElement("td"); td.textContent = plain(c); row.appendChild(td); }); tb.appendChild(row); });
    table.appendChild(tb); tw.appendChild(table);
    if (rows.length > 2500) { const p = el("p", "src"); p.textContent = "İlk 2.500 satır gösteriliyor (toplam " + rows.length + ")."; tw.appendChild(p); }
    details.dataset.done = "1";
  }

  // ---------- page assembly
  const charts = [];
  function buildCard(spec) {
    const wide = spec.type === "map" || spec.type === "gantt" || spec.type === "heatmap" || spec.wide;
    const card = el("article", "card" + (wide ? " wide" : ""));
    card.id = "c-" + spec.id;
    const head = el("div", "pad");
    const h3 = el("h3", null, md(spec.title)); head.appendChild(h3);
    head.appendChild(el("p", "sub", md(spec.subtitle)));
    card.appendChild(head);
    const leg = el("div", "pad"); const ul = el("ul", "legend"); ul.hidden = true; leg.appendChild(ul);
    const ramp = el("div", "ramp"); ramp.hidden = true; leg.appendChild(ramp); card.appendChild(leg);
    const plotWrap = el("div", "pad"); const plot = el("div", "plot"); plot.setAttribute("aria-label", spec.title); plotWrap.appendChild(plot); card.appendChild(plotWrap);
    const foot = el("div", "pad"); foot.style.display = "grid"; foot.style.gap = "8px";
    foot.appendChild(el("p", "read", "<b>Nasıl okunur.</b> " + md(spec.read)));
    if (spec.caveat) foot.appendChild(el("p", "caveat", "<b>Dikkat.</b> " + md(spec.caveat)));
    const row = el("div", "meta-row");
    const det = el("details", "tbl"); det.appendChild(el("summary", null, "Veriyi tablo olarak göster")); det.appendChild(el("div", "tw"));
    det.addEventListener("toggle", () => { if (det.open) fillTable(det, spec); });
    row.appendChild(det);
    const src = el("span", "src"); src.textContent = "Kaynak: " + spec.source; row.appendChild(src);
    foot.appendChild(row); card.appendChild(foot);
    charts.push({ spec, card, plot });
    return card;
  }
  function render(c) {
    c.plot.replaceChildren();
    const W = Math.max(280, Math.round(c.plot.getBoundingClientRect().width || 600));
    try { (R[c.spec.type] || (() => { }))(c.plot, c.card, c.spec, W); }
    catch (e) { c.plot.textContent = "Grafik çizilemedi: " + e.message; console.error(c.spec.id, e); }
  }
  function renderAll() { charts.forEach(render); }

  document.getElementById("lede").innerHTML = md(DATA.page.lede);
  document.getElementById("banner").innerHTML = md(DATA.page.banner);
  const tiles = document.getElementById("tiles");
  DATA.page.tiles.forEach(t => {
    const d = el("div", "tile");
    d.append(el("div", "t-label", md(t.label)), el("div", "t-val", md(t.value)), el("div", "t-sub", md(t.sub)));
    tiles.appendChild(d);
  });
  const toc = document.getElementById("toc"), main = document.getElementById("sections");
  DATA.sections.forEach((s, i) => {
    const a = el("a"); a.href = "#" + s.section; a.textContent = (i + 1) + ". " + plain(s.toc_tr || s.title_tr); toc.appendChild(a);
    const band = el("section", "band"); band.id = s.section;
    const head = el("div", "band-head");
    head.appendChild(el("p", "band-num", "Bölüm " + (i + 1)));
    head.appendChild(el("h2", null, md(s.title_tr)));
    const intro = el("div", "intro"); (s.intro_tr || []).forEach(p => intro.appendChild(el("p", null, md(p)))); head.appendChild(intro);
    band.appendChild(head);
    if (s.bullets_tr && s.bullets_tr.length) { const ul = el("ul", "findings"); s.bullets_tr.forEach(b => ul.appendChild(el("li", null, md(b)))); band.appendChild(ul); }
    if (s.blocks_tr && s.blocks_tr.length) {
      const bl = el("div", "blocks");
      s.blocks_tr.forEach(b => { const d = el("div", "block"); d.appendChild(el("h3", null, md(b.h))); const list = el(b.ordered ? "ol" : "ul"); b.items.forEach(it => list.appendChild(el("li", null, md(it)))); d.appendChild(list); bl.appendChild(d); });
      band.appendChild(bl);
    }
    if (s.table_tr) {
      const wrap = el("div", "tablewrap"); const t = el("table", "st");
      const tr = el("tr"); s.table_tr.head.forEach(h => tr.appendChild(el("th", null, md(h)))); const th = el("thead"); th.appendChild(tr); t.appendChild(th);
      const tb = el("tbody"); s.table_tr.rows.forEach(r => { const row = el("tr"); r.forEach((c, k) => row.appendChild(el("td", k > 0 && /^[\d.,\s/]+$/.test(String(c)) ? "num" : null, md(c)))); tb.appendChild(row); }); t.appendChild(tb);
      wrap.appendChild(t); band.appendChild(wrap);
    }
    if (s.charts && s.charts.length) { const grid = el("div", "grid"); s.charts.forEach(c => grid.appendChild(buildCard(c))); band.appendChild(grid); }
    main.appendChild(band);
  });
  const foot = document.getElementById("foot");
  DATA.page.footer.forEach(p => foot.appendChild(el("p", null, md(p))));

  renderAll();
  let rt = null;
  const ro = new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(renderAll, 150); });
  ro.observe(main);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
  new MutationObserver(renderAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
