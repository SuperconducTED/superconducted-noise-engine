name: Calibration Pipeline Health

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Build the state index before rendering.'
        required: false
        type: boolean
        default: false
      rebuild:
        description: 'With backfill: rewrite the whole index in last_update_date order. Required once the poller has appended rows.'
        required: false
        type: boolean
        default: false
      floors:
        description: 'Space-separated LABEL=VALUE candidate floors. Blank uses the workflow default below.'
        required: false
        type: string
        default: ''
      data_branch:
        description: 'Data branch to read and update. Use a scratch branch for validation.'
        required: false
        type: string
        default: calibration-data

# FR-7: candidate floors are configuration, never a literal in the renderer.
#
# 1170 is NC-012 as corrected on 2026-09-09 (#56 FR-10): NC-045 measures the rule
# base in use with count_trainable_parameters and gets 234 parameters, times the
# x5 samples-per-parameter rule of thumb. It supersedes the 630 this workflow
# shipped until now, whose 126 no reachable file derives and which undercounts
# the consequent term by one output dimension.
#
# 1215 is the same rule of thumb for TanhBellMF, which NC-046 measures at 243
# parameters because it carries 3 premise parameters per MF rather than 2.
#
# Both ship as labelled candidates: issue #48 section 1.2 is explicit that this
# pipeline does not decide the training floor, and NC-045 is still a provisional
# laptop measurement awaiting the batch-2 canonical record.
env:
  HEALTH_FLOORS: 'NC-012=1170 TanhBellMF=1215'

# Deliberately NOT the poller's group. Sharing one would let a render cancel a
# queued poll, and a cancelled poll writes no ledger row. The resulting push
# race is handled by scripts/push_with_retry.sh instead.
concurrency:
  group: calibration-health
  cancel-in-progress: false

jobs:
  backfill:
    if: ${{ inputs.backfill }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DATA_BRANCH: ${{ inputs.data_branch || 'calibration-data' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          path: data
          fetch-depth: 1
          sparse-checkout: |
            snapshots
            health
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and commit the state index
        run: |
          PYTHONPATH=source python source/scripts/backfill_state_index.py \
            --root data ${{ inputs.rebuild && '--rebuild' || '' }}
          cd data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health/state-index.tsv
          git diff --cached --quiet && exit 0
          git commit -m 'health: backfill state index'
          ../source/scripts/push_with_retry.sh origin "$DATA_BRANCH"

  render:
    needs: backfill
    if: ${{ always() && (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      DATA_BRANCH: ${{ inputs.data_branch || 'calibration-data' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          path: data
          fetch-depth: 1
          sparse-checkout: |
            health
            ledger
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render metrics and SVG
        env:
          FLOORS: ${{ inputs.floors || env.HEALTH_FLOORS }}
        run: |
          floor_args=()
          for floor in $FLOORS; do floor_args+=(--floor "$floor"); done
          PYTHONPATH=source python source/scripts/pipeline_health.py \
            --root data "${floor_args[@]}"
      - name: Commit only material health changes
        run: |
          cd data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health/
          # metrics.json carries generated_at and so changes every render. The SVG
          # carries no clock reading, so it changes only when the archive or the
          # poll history did -- that is the commit-on-change signal (FR-6).
          # state-index.tsv is not part of the gate: this job never writes it, and
          # the backfill job above commits it itself.
          if git diff --cached --quiet -- health/progress.svg; then
            git restore --staged health/metrics.json
            exit 0
          fi
          git commit -m 'health: refresh pipeline dashboard'
          ../source/scripts/push_with_retry.sh origin "$DATA_BRANCH"
