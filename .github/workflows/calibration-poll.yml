# Hourly calibration poller for IBM Quantum backends (ticket #002).
name: Calibration Polling

on:
  # Four entries per hour, not one, because GitHub dispatches `schedule` on a
  # best-effort queue and drops it under load: measured 6.13 runs/day over the
  # 15 days to 2026-09-10, about 26% of the 24/day this cron asks for, with a
  # median gap of 3.23 h and a worst gap of 12.70 h. 99 of those 100 runs
  # SUCCEEDED, so this is dropped dispatches rather than failing jobs, and no
  # amount of fixing the job will change it (#49).
  #
  # Spread across the hour rather than clustered, so one load spike is less
  # likely to take all four, and off the top of the hour per GitHub's own
  # documented mitigation. :37 is kept because NC-008 records it as the target.
  #
  # This raises the odds of at least one poll per hour; it does not guarantee
  # one, and it is a mitigation rather than the fix. The fix is #49's sweep,
  # which makes a missed poll cost latency instead of data. Extra polls inside
  # one hour are cheap: IBM republishes every ~1.26 h (NC-030), so a duplicate
  # stamp is recorded as `duplicate` and its payload discarded.
  schedule:
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'
  # A manual run with all inputs blank behaves exactly like a scheduled poll.
  # Fill start and end to sweep a historical window instead — verified 2026-08-29
  # that properties(datetime=...) is honoured on ibm_quantum_platform out to at
  # least 60 days, so a scheduler outage is recoverable if caught in time.
  workflow_dispatch:
    inputs:
      historical_start:
        description: 'Backfill start, ISO-8601 UTC. Blank = normal single poll.'
        required: false
        default: ''
      historical_end:
        description: 'Backfill end, ISO-8601 UTC.'
        required: false
        default: ''
      historical_step_hours:
        description: 'Step in hours; fractions allowed (0.5, 0.25). A 1h sweep
          was measured to return only 87.9% of documents known to exist
          (NC-031), so prefer 0.5 or finer for recovery.'
        required: false
        default: '2'
      max_historical_days:
        description: 'Reject requests older than this. Probed good to 60.'
        required: false
        default: '30'

concurrency:
  # A health render must not cancel a queued poll: absent ledger rows are the
  # scheduler-degradation signal this pipeline exists to expose.
  group: calibration-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # A scheduled poll finishes in ~40s, so keep its bound tight; a backfill
    # sweep makes one API call per step and legitimately needs longer.
    timeout-minutes: ${{ inputs.historical_start && 60 || 10 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Python 3.12 matches pyproject.toml requires-python floor.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      # The poller reads one secret from the environment. Inputs are passed via
      # env, never interpolated into the shell.
      - name: Run poller
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          HIST_START: ${{ inputs.historical_start }}
          HIST_END: ${{ inputs.historical_end }}
          HIST_STEP: ${{ inputs.historical_step_hours || '2' }}
          MAX_HIST_DAYS: ${{ inputs.max_historical_days || '30' }}
        run: |
          if [ -n "$HIST_START" ] && [ -n "$HIST_END" ]; then
            echo "Backfill sweep: $HIST_START .. $HIST_END every ${HIST_STEP}h"
            superconducted-poll --backend ibm_fez \
              --historical "$HIST_START" "$HIST_END" "$HIST_STEP" \
              --max-historical-days "$MAX_HIST_DAYS"
          else
            superconducted-poll --backend ibm_fez
          fi

      - name: Verify poller produced snapshots
        run: |
          test -n "$(ls -A data/calibration/ibm_fez 2>/dev/null)" || {
            echo "::error::poller produced no files"
            exit 1
          }

      # Snapshots are pushed to the dedicated calibration-data branch by
      # scripts/file_snapshots.sh, which checks that branch out into a SEPARATE
      # worktree under $RUNNER_TEMP and files into it. It must not be checked
      # out in place: doing so removed scripts/ from this tree mid-step, the
      # canonical digest the filing step calls was gone, and every genuine
      # duplicate would have been recorded as collision-unreadable (PR #50
      # review). The script -- payload-month filing, never-overwrite, canonical
      # duplicate/collision split, poll ledger -- is exercised end to end, real
      # branch switch included, by tests/test_file_snapshots.py.
      - name: Commit snapshot to calibration-data branch
        env:
          STAGING_DIR: data/calibration
          DATA_WORKTREE: ${{ runner.temp }}/calibration-data
          # Only a backfill may explain a stamp collision away as a lossy
          # historical re-read. A scheduled poll fetches live, so any
          # difference under an archived stamp is real divergence and is
          # preserved. See scripts/file_snapshots.sh.
          IS_BACKFILL: ${{ inputs.historical_start && '1' || '0' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/file_snapshots.sh
