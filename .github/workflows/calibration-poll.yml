# Hourly calibration poller for IBM Quantum backends (ticket #002).
name: Calibration Polling

on:
  schedule:
    - cron: '37 * * * *'
  # A manual run with all inputs blank behaves exactly like a scheduled poll.
  # Fill start and end to sweep a historical window instead — verified 2026-08-29
  # that properties(datetime=...) is honoured on ibm_quantum_platform out to at
  # least 60 days, so a scheduler outage is recoverable if caught in time.
  workflow_dispatch:
    inputs:
      historical_start:
        description: 'Backfill start, ISO-8601 UTC. Blank = normal single poll.'
        required: false
        default: ''
      historical_end:
        description: 'Backfill end, ISO-8601 UTC.'
        required: false
        default: ''
      historical_step_hours:
        description: 'Step in hours. Keep under the readout p10 of 2.5h.'
        required: false
        default: '2'
      max_historical_days:
        description: 'Reject requests older than this. Probed good to 60.'
        required: false
        default: '30'

concurrency:
  group: calibration-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # A scheduled poll finishes in ~40s, so keep its bound tight; a backfill
    # sweep makes one API call per step and legitimately needs longer.
    timeout-minutes: ${{ inputs.historical_start && 60 || 10 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Python 3.12 matches pyproject.toml requires-python floor.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      # The poller reads one secret from the environment. Inputs are passed via
      # env, never interpolated into the shell.
      - name: Run poller
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          HIST_START: ${{ inputs.historical_start }}
          HIST_END: ${{ inputs.historical_end }}
          HIST_STEP: ${{ inputs.historical_step_hours || '2' }}
          MAX_HIST_DAYS: ${{ inputs.max_historical_days || '30' }}
        run: |
          if [ -n "$HIST_START" ] && [ -n "$HIST_END" ]; then
            echo "Backfill sweep: $HIST_START .. $HIST_END every ${HIST_STEP}h"
            superconducted-poll --backend ibm_fez \
              --historical "$HIST_START" "$HIST_END" "$HIST_STEP" \
              --max-historical-days "$MAX_HIST_DAYS"
          else
            superconducted-poll --backend ibm_fez
          fi

      - name: Verify poller produced snapshots
        run: |
          test -n "$(ls -A data/calibration/ibm_fez 2>/dev/null)" || {
            echo "::error::poller produced no files"
            exit 1
          }

      # Snapshots are pushed to the dedicated calibration-data branch.
      #
      # Two rules this step must not break, both learned the hard way:
      #  - the destination month comes from the payload-derived FILENAME,
      #    never from the run clock. The two disagree either side of a month
      #    boundary and misfiled two June payloads under 2026-07 (#45 §4a).
      #  - an already-archived path is NEVER overwritten. The filename is the
      #    backend's own last_update_date, so a collision means IBM has not
      #    republished; overwriting is what silently discarded five
      #    gate-level versions (#46 §3c).
      - name: Commit snapshot to calibration-data branch
        run: |
          shopt -s nullglob
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/staging
          cp -r data/calibration/* /tmp/staging/
          git fetch origin calibration-data
          git checkout -B calibration-data origin/calibration-data

          poll_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          added=0

          # The ledger is keyed by POLL time (unlike snapshots, which are keyed
          # by payload time) because it records polling events, including the
          # ones that observed nothing new. Without it a quiet stretch is
          # indistinguishable from a stopped poller once the 90-day Actions run
          # retention expires — which is exactly what made #45 expensive.
          ledger="ledger/$(date -u +%Y-%m).tsv"
          mkdir -p ledger collisions
          if [ ! -e "$ledger" ]; then
            printf 'poll_time_utc\tbackend\tlast_update_date\tdecision\n' > "$ledger"
          fi

          for f in /tmp/staging/ibm_fez/*.json; do
            base=$(basename "$f")
            stem=${base%.json}
            dest="snapshots/${stem:0:4}-${stem:4:2}/ibm_fez"
            mkdir -p "$dest"
            if [ ! -e "$dest/$base" ]; then
              mv "$f" "$dest/"
              decision=new
              added=$((added + 1))
            else
              # A stamp collision does NOT prove the documents match -- #46 §3c
              # lost five gate-level versions under one stamp. But the
              # comparison must be CANONICAL, not bytewise: the archive predates
              # the serialize_target sort, so every pre-fix file holds
              # target.operations unsorted and `cmp` would call every duplicate
              # a collision. See scripts/canonical_snapshot_digest.py.
              set +e
              python scripts/canonical_snapshot_digest.py --compare "$f" "$dest/$base"
              same=$?
              set -e
              if [ "$same" -eq 0 ]; then
                # Same document. IBM has not republished; a true no-op.
                decision=duplicate
              else
                # Genuinely different (1), or undecidable (2). Both preserve:
                # keep the archived copy AND the new payload beside it.
                sha=$(sha256sum "$f" | cut -c1-16)
                coll="collisions/${stem:0:4}-${stem:4:2}/ibm_fez"
                mkdir -p "$coll"
                mv "$f" "$coll/$stem.$sha.json"
                if [ "$same" -eq 2 ]; then
                  decision=collision-unreadable
                  echo "::warning::$stem could not be compared with the archived copy; preserved at $coll/$stem.$sha.json"
                else
                  decision=collision
                  echo "::warning::$stem differs from the archived copy under the same stamp; preserved at $coll/$stem.$sha.json"
                fi
              fi
            fi
            printf '%s\t%s\t%s\t%s\n' "$poll_time" ibm_fez "$stem" "$decision" >> "$ledger"
          done

          git add snapshots/ ledger/ collisions/
          if git diff --cached --quiet; then
            echo '::warning::nothing staged - poller produced no payload'
          elif [ "$added" -gt 0 ]; then
            git commit -m "calibration: $poll_time ibm_fez (+$added)"
          else
            git commit -m "poll: $poll_time ibm_fez (no new document)"
          fi
          git push origin calibration-data
